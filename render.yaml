# Render Blueprint for the Forensic server.
#
# When you connect this repo to Render and create a new Blueprint
# (Dashboard → New + → Blueprint), Render reads this file and
# proposes the services below. You fill in the `sync: false` env
# vars (the secrets) in the Render UI when prompted.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: forensic-server
    runtime: node
    region: oregon            # change if a closer region matters
    plan: free
    branch: main
    rootDir: .
    # Belt-and-suspenders for Chromium install (Build #5.66.1):
    # `pnpm install` should run puppeteer's postinstall because of the
    # root package.json's `pnpm.onlyBuiltDependencies` whitelist, but
    # Render's pnpm/cache machinery occasionally skips it on
    # `--frozen-lockfile`. The explicit `puppeteer browsers install`
    # step at the end guarantees Chromium is in PUPPETEER_CACHE_DIR
    # before the server boots, regardless. ~1 sec when cached, ~30 sec
    # on a fresh download.
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @forensic/server exec puppeteer browsers install chrome"
    startCommand: "pnpm --filter @forensic/server start"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Build #5.134.1: stop corepack hanging the deploy. The
      # startCommand invokes pnpm through corepack, which — on a cold
      # free-tier start where pnpm@<pinned> isn't cached in the runtime
      # image — prints "! Corepack is about to download …" and then
      # BLOCKS on an interactive "continue? [Y/n]" prompt that never
      # gets an answer in Render's non-TTY shell. The server never binds
      # its port, the /healthz check never passes, and the deploy spins
      # forever (observed: 13+ min hang on the #5.133.1 deploy). Setting
      # this to 0 makes corepack proceed with the download silently.
      - key: COREPACK_ENABLE_DOWNLOAD_PROMPT
        value: "0"
      # Puppeteer Chromium cache (Build #5.74.1 — corrected from
      # #5.62.1). MUST be inside `/opt/render/project/src/` because
      # ONLY that path is packed into the runtime container image.
      # `/opt/render/.cache/` (which #5.62.1 used) is the build cache
      # — it persists across builds but is NOT available at runtime,
      # which is why puppeteer.launch() couldn't find Chromium even
      # though the build log showed a successful install. With the
      # cache inside src, the build-time install survives into the
      # runtime image.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.puppeteer-cache
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
