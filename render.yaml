# Render Blueprint for the Forensic server.
#
# When you connect this repo to Render and create a new Blueprint
# (Dashboard → New + → Blueprint), Render reads this file and
# proposes the services below. You fill in the `sync: false` env
# vars (the secrets) in the Render UI when prompted.
#
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: forensic-server
    runtime: node
    region: oregon            # change if a closer region matters
    plan: free
    branch: main
    rootDir: .
    # Belt-and-suspenders for Chromium install (Build #5.66.1):
    # `pnpm install` should run puppeteer's postinstall because of the
    # root package.json's `pnpm.onlyBuiltDependencies` whitelist, but
    # Render's pnpm/cache machinery occasionally skips it on
    # `--frozen-lockfile`. The explicit `puppeteer browsers install`
    # step at the end guarantees Chromium is in PUPPETEER_CACHE_DIR
    # before the server boots, regardless. ~1 sec when cached, ~30 sec
    # on a fresh download.
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @forensic/server exec puppeteer browsers install chrome"
    startCommand: "pnpm --filter @forensic/server start"
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Puppeteer (Build #5.62.1) downloads Chromium at `pnpm install`
      # time. Render persists `/opt/render/.cache` between builds, so
      # pointing the Puppeteer cache there avoids re-downloading
      # ~150 MB of Chromium on every deploy.
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/.cache/puppeteer
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
