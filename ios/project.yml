name: SitePhoto
options:
  bundleIdPrefix: com.murumoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# Swift Package Manager dependencies.
# After editing this section, regenerate the Xcode project:
#   cd ios && xcodegen generate
# Then in Xcode, wait for "Package Resolution" to finish before building.
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.0.0

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: "C73QVZSGPX"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  SitePhoto:
    type: application
    platform: iOS
    sources:
      - path: SitePhoto
    dependencies:
      - package: Supabase
        product: Supabase
    entitlements:
      path: SitePhoto/SitePhoto.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.murumoto.sitephoto
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.murumoto.sitephoto
    info:
      path: SitePhoto/Info.plist
      properties:
        CFBundleDisplayName: SitePhoto
        CFBundleShortVersionString: "6.0.0"
        CFBundleVersion: "1"
        # SitePhoto uses only HTTPS (URLSession) — no custom crypto,
        # nothing that triggers US export-compliance review. Declaring
        # this flag lets TestFlight skip the per-upload encryption-
        # compliance prompt. Xcode Cloud's CFBundleVersion overrides
        # the static "1" above on every workflow run (see
        # ios/ci_scripts/ci_post_clone.sh).
        ITSAppUsesNonExemptEncryption: false
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities:
          - arm64
        NSCameraUsageDescription: "SitePhoto uses the camera to capture site documentation photos."
        NSLocationWhenInUseUsageDescription: "SitePhoto records the GPS location and address of each project at the start of a session."
        NSPhotoLibraryAddUsageDescription: "SitePhoto can save exported PDFs and photos to your Photos library."
        NSMicrophoneUsageDescription: "SitePhoto uses the microphone so you can dictate photo captions and observations in the field instead of typing."
        NSSpeechRecognitionUsageDescription: "SitePhoto converts your dictated observations into text. Recognition runs on-device when possible so the audio doesn't leave your iPhone."
        NSUbiquitousContainers:
          iCloud.com.murumoto.sitephoto:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            NSUbiquitousContainerName: SitePhoto
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        # iPad supports all four orientations so Split View and Stage
        # Manager can place SitePhoto in any orientation. iPhone keeps
        # the system default (portrait + landscape both ways).
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        # Universal binary: 1 = iPhone, 2 = iPad. Multitasking
        # (Split View, Slide Over, Stage Manager) is enabled
        # automatically because we don't set UIRequiresFullScreen=YES.
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: com.murumoto.sitephoto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
