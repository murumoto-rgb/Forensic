<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SitePhoto Field Documentation</title>
<style>
:root{
  --navy:#0d1b2a;--navy2:#162032;--navy3:#1e2f42;--steel:#2c4159;--teal:#1a6b5c;--teal2:#22896f;--amber:#d4820a;--amber2:#f0a020;--red:#c0392b;--dim:#8fa3b8;--text:#e8eef5;--line:#334a63;--blue:#2b7fff;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--navy);color:var(--text);font-family:var(--sans)}
body{min-height:100dvh;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.topbar{height:54px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--steel);background:var(--navy2);font-family:var(--mono)}
.brand{font-weight:700;letter-spacing:.04em}.spacer{flex:1}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--steel);background:var(--navy3);color:var(--text);font:12px var(--mono);padding:3px 7px}.badge.rec{background:var(--red);border-color:var(--red)}.badge.gps,.badge.dr{background:var(--teal);border-color:var(--teal2)}.badge.man{background:var(--amber);border-color:var(--amber2);color:#111}.badge.warn{background:transparent;border-color:var(--amber);color:var(--amber2)}
button,input,select{font-family:var(--mono)}button{border:1px solid var(--steel);background:var(--navy3);color:var(--text);padding:9px 10px;border-radius:0;font-size:13px}button.primary{background:var(--teal);border-color:var(--teal2)}button.danger{background:var(--red);border-color:var(--red)}button:disabled{opacity:.45}.content{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}.side{border-right:1px solid var(--steel);background:var(--navy2);overflow:auto}.main{position:relative;min-width:0;min-height:0;background:#07111d}.panel{padding:12px;border-bottom:1px solid var(--steel)}h2,h3{font-family:var(--mono);font-size:14px;margin:0 0 10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font:11px var(--mono);color:var(--dim);text-transform:uppercase}.field input{background:var(--navy);border:1px solid var(--steel);color:var(--text);padding:9px}.session{border:1px solid var(--steel);padding:9px;margin:8px 0;background:var(--navy3);cursor:pointer}.session.active{outline:2px solid var(--teal2)}.session .title{font:13px var(--mono);font-weight:700}.session .meta{font:11px var(--mono);color:var(--dim);margin-top:5px}.tabs{display:flex}.tabs button{flex:1;border-left:0;border-right:1px solid var(--steel)}.tabBody{display:none}.tabBody.show{display:block}.metric{font:12px var(--mono);color:var(--dim)}.hud{position:absolute;left:10px;top:10px;z-index:5;display:grid;grid-template-columns:repeat(2,minmax(92px,auto));gap:6px;pointer-events:none}.hud .box{background:rgba(13,27,42,.85);border:1px solid var(--steel);padding:6px 7px;font:12px var(--mono)}.hud b{color:var(--text)}#planCanvas{width:100%;height:100%;display:block;touch-action:none}.cameraOverlay{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column}.cameraOverlay.show{display:flex}video{width:100%;height:100%;object-fit:cover}.cameraHud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:25}.cameraControls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:25}.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:#eee;color:#111}.flash{animation:flash .18s}@keyframes flash{from{filter:brightness(3)}to{filter:brightness(1)}}.photoItem{border-bottom:1px solid var(--steel);padding:9px}.photoItem .n{font:13px var(--mono);font-weight:700}.thumb{width:72px;height:54px;object-fit:cover;border:1px solid var(--steel);float:right;margin-left:8px}.modal{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.card{width:min(720px,100%);max-height:90dvh;overflow:auto;background:var(--navy2);border:1px solid var(--steel);padding:14px}.wizardCanvas{width:100%;height:430px;border:1px solid var(--steel);background:#111;touch-action:none}.notice{background:var(--navy3);border:1px solid var(--steel);padding:10px;margin:8px 0;font:12px var(--mono);color:var(--dim)}.corr{position:absolute;left:10px;right:10px;bottom:10px;z-index:10;background:rgba(22,32,50,.95);border:1px solid var(--amber);padding:10px;display:none}.corr.show{display:block}.detail{position:absolute;right:10px;top:10px;z-index:6;background:rgba(22,32,50,.96);border:1px solid var(--steel);padding:10px;min-width:220px;font:12px var(--mono);display:none}.detail.show{display:block}.photoPreview{position:absolute;left:0;right:0;top:50%;bottom:0;z-index:22;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:10px;cursor:pointer;border-top:1px solid var(--steel)}.photoPreview.show{display:flex}.photoPreview img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--steel)}.planCtl{position:absolute;right:10px;top:90px;z-index:6;display:flex;flex-direction:column;gap:6px}.planCtl button{width:46px;height:46px;padding:0;font:13px var(--mono);background:rgba(22,32,50,.92);color:var(--text);border:1px solid var(--steel)}.zoomBar{position:absolute;left:0;right:0;bottom:calc(110px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:25;pointer-events:none}.zoomBar button{pointer-events:auto;width:48px;height:36px;border-radius:18px;background:rgba(0,0,0,.55);color:#fff;border:1px solid #777;font:12px var(--mono)}.zoomBar button.active{background:#fff;color:#111;border-color:#fff}.flashBar{position:absolute;left:50%;transform:translateX(-50%);top:14px;display:flex;gap:6px;z-index:26;pointer-events:none}.flashBar button{pointer-events:auto;padding:5px 10px;min-width:54px;background:rgba(0,0,0,.55);color:#fff;border:1px solid #777;font:11px var(--mono);border-radius:14px}.flashBar button.active{background:#fff;color:#111;border-color:#fff}.flashBar .note{padding:5px 10px;background:rgba(0,0,0,.55);color:#bbb;border:1px solid #555;font:10px var(--mono);border-radius:14px;pointer-events:auto}@media(max-width:820px){.content{grid-template-columns:1fr}.side{position:absolute;left:0;top:54px;bottom:0;width:88vw;max-width:360px;z-index:15;transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.mobileOnly{display:inline-flex!important}}.mobileOnly{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><button id="menuBtn" class="mobileOnly">☰</button><div class="brand">SITEPHOTO</div><span id="recBadge" class="badge">IDLE</span><div class="spacer"></div><button id="cameraBtn" class="primary">Camera</button></div>
  <div class="content">
    <aside class="side" id="side">
      <div class="panel"><h2>Sessions</h2><div class="field"><label>Project Name</label><input id="sessionName" placeholder="required" /></div><div class="row"><button id="newSession" class="primary">New</button><button id="startStop">Start</button><button id="deleteSession">Delete</button></div><div id="sessions"></div></div>
      <div class="tabs"><button data-tab="photos" class="tabBtn">Photos</button><button data-tab="plan" class="tabBtn">Plan</button><button data-tab="export" class="tabBtn">Export</button></div>
      <div id="photos" class="tabBody show"><div class="panel"><h3>Photo Index</h3><div id="photoList" class="metric">No photos.</div></div></div>
      <div id="plan" class="tabBody"><div class="panel"><h3>Floor Plan</h3><div class="row"><button id="planSetup">Setup</button><button id="resetView">Fit View</button></div><div id="planStatus" class="notice">No floor plan calibrated. Grid mode active.</div></div></div>
      <div id="export" class="tabBody"><div class="panel"><h3>Session Export</h3><button id="downloadPdf" class="primary">Download PDF</button><div class="notice">PDF: project map, floor plan with bubbles, then a photo contact sheet (2 columns × 3 rows per Letter page).</div></div></div>
    </aside>
    <main class="main"><canvas id="planCanvas"></canvas><div class="detail" id="detail"></div><div class="photoPreview" id="photoPreview"><img id="photoPreviewImg" alt=""></div><div class="planCtl"><button id="vFit" title="Fit View">FIT</button><button id="vIn" title="Zoom In">+</button><button id="vOut" title="Zoom Out">-</button><button id="vCtr" title="Center on Last Photo">CTR</button><button id="vBubblePlus" title="Larger bubbles">B+</button><button id="vBubbleMinus" title="Smaller bubbles">B-</button></div><div class="corr" id="corr"></div></main>
  </div>
</div>
<div class="cameraOverlay" id="cam"><video id="video" playsinline autoplay muted></video><div class="cameraHud" id="cameraHud"></div><div class="flashBar" id="flashBar"></div><div class="zoomBar" id="zoomBar"></div><div class="cameraControls"><button id="closeCam">Close</button><button id="shutter" class="shutter">●</button></div></div>
<div class="modal" id="wizard"><div class="card"><h2>Floor Plan Setup</h2><div id="wizBody"></div><div class="row" style="margin-top:10px"><button id="wizBack">Back</button><button id="wizNext" class="primary">Next</button><button id="wizClose">Close</button></div></div></div>
<canvas id="captureCanvas" style="display:none"></canvas>
<script>
'use strict';
const $=id=>document.getElementById(id); const DPR=()=>window.devicePixelRatio||1; const rad=d=>d*Math.PI/180; const deg=r=>(r*180/Math.PI+360)%360;
const COLORS={navy:'#0d1b2a',navy2:'#162032',navy3:'#1e2f42',steel:'#2c4159',teal:'#1a6b5c',amber:'#d4820a',red:'#c0392b',dim:'#8fa3b8',text:'#e8eef5',blue:'#2b7fff'};
let state={sessions:[],currentId:null,ui:{transform:{x:0,y:0,scale:1},selected:null,tab:'photos'},camera:{zoom:1,deviceId:null,devices:[],lenses:[],digitalFactor:1,activeLens:null,flash:'auto',torchSupported:false},pendingPhotos:[],cameraStream:null,planImg:null,wiz:{step:1,img:null,imgSrc:null,a:null,b:null,distFt:null,anchor:null,northDeg:180},corr:null};
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function nowName(){return new Date().toLocaleString()} function cur(){return state.sessions.find(s=>s.id===state.currentId)||null}
function save(){localStorage.setItem('sitephoto.v1',JSON.stringify({sessions:state.sessions,currentId:state.currentId}))}
function load(){try{const x=JSON.parse(localStorage.getItem('sitephoto.v1')||'{}');state.sessions=x.sessions||[];state.currentId=x.currentId||state.sessions[0]?.id||null}catch(e){}const bs=parseFloat(localStorage.getItem('sitephoto.bubbleScale')||'1');state.ui.bubbleScale=(isNaN(bs)||bs<=0)?1:bs;const fl=localStorage.getItem('sitephoto.flash');if(fl==='auto'||fl==='on'||fl==='off')state.camera.flash=fl}
function adjustBubbles(factor){const cur=state.ui.bubbleScale||1;const next=Math.max(0.3,Math.min(3,cur*factor));state.ui.bubbleScale=next;localStorage.setItem('sitephoto.bubbleScale',String(next));draw()}
function newSession(){const name=$('sessionName').value.trim();if(!name)return alert('Enter a project name first.');const s={id:uid(),name,projectName:name,created:new Date().toISOString(),started:false,stopped:false,photos:[],floorPlan:null,path:[],projectGps:null};state.sessions.unshift(s);state.currentId=s.id;$('sessionName').value='';save();renderAll();fitView()}
function toggleStart(){const s=cur();if(!s)return;if(!s.started){s.started=true;s.stopped=false;const ts=new Date().toISOString();if(!s.startedAt){s.startedAt=ts;if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{s.projectGps={lat:p.coords.latitude,lon:p.coords.longitude,altitude:p.coords.altitude,accuracy:p.coords.accuracy,timestamp:new Date().toISOString()};save();renderAll();reverseGeocode(p.coords.latitude,p.coords.longitude).then(addr=>{if(addr&&state.sessions.some(x=>x.id===s.id)){s.projectAddress=addr;save();renderAll()}})},e=>console.warn('start GPS failed',e),{enableHighAccuracy:true,timeout:8000})}else{s.lastResumedAt=ts}}else{s.started=false;s.stopped=true;s.lastStoppedAt=new Date().toISOString()}save();renderAll()}
async function reverseGeocode(lat,lon){const key=`${lat.toFixed(4)},${lon.toFixed(4)}`;let cache={};try{cache=JSON.parse(localStorage.getItem('sitephoto.geocode')||'{}')}catch(e){}if(cache[key])return cache[key];try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=18&addressdetails=1`,{headers:{'Accept':'application/json'}});if(!r.ok)return null;const j=await r.json();const a=j.address||{};const parts=[];const num=a.house_number,road=a.road||a.pedestrian||a.footway;if(num&&road)parts.push(`${num} ${road}`);else if(road)parts.push(road);const city=a.city||a.town||a.village||a.hamlet||a.suburb||a.neighbourhood;if(city)parts.push(city);const lvl4=a['ISO3166-2-lvl4'];const stateCode=lvl4?lvl4.split('-')[1]:a.state_code||a.state;const postcode=a.postcode;if(stateCode&&postcode)parts.push(`${stateCode} ${postcode}`);else if(stateCode)parts.push(stateCode);else if(postcode)parts.push(postcode);const out=parts.join(', ')||j.display_name||null;if(out){cache[key]=out;try{localStorage.setItem('sitephoto.geocode',JSON.stringify(cache))}catch(e){}}return out}catch(e){console.warn('reverse geocode failed',e);return null}}
function deleteSession(){const s=cur();if(!s)return;if(!confirm('Delete current session?'))return;state.sessions=state.sessions.filter(x=>x.id!==s.id);state.currentId=state.sessions[0]?.id||null;save();renderAll();fitView()}
async function openCamera(){try{if(!cur()||!cur().started||cur().stopped)return alert('Start an active session first.');state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=state.cameraStream;$('cam').classList.add('show');try{const all=await navigator.mediaDevices.enumerateDevices();state.camera.devices=all.filter(d=>d.kind==='videoinput')}catch(e){state.camera.devices=[]}state.camera.lenses=classifyLenses(state.camera.devices);state.camera.zoom=1;state.camera.digitalFactor=1;state.camera.deviceId=state.cameraStream.getVideoTracks()[0]?.getSettings?.().deviceId||null;const initial=state.camera.lenses.find(l=>l.deviceId===state.camera.deviceId);state.camera.activeLens=initial?.kind||(state.camera.lenses.find(l=>l.kind==='wide')?.kind||null);if(state.camera.lenses.length&&!initial){const wide=state.camera.lenses.find(l=>l.kind==='wide')||state.camera.lenses[0];try{state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:wide.deviceId}}});$('video').srcObject=state.cameraStream;state.camera.deviceId=wide.deviceId;state.camera.activeLens=wide.kind}catch(e){console.warn('initial wide select failed',e)}}$('video').style.transform='';refreshTorchSupport();renderZoomBar();renderFlashBar();await syncFlashState()}catch(e){alert('Camera failed: '+e.message)}}
function classifyLenses(devices){const back=devices.filter(d=>/back|rear/i.test(d.label||''));const list=back.length?back:devices.filter(d=>!/front|user/i.test(d.label||''));return list.map(d=>{const l=(d.label||'').toLowerCase();let base=1,kind='wide';if(/ultra/.test(l)){base=0.5;kind='ultrawide'}else if(/tele/.test(l)){base=5;kind='telephoto'}return{deviceId:d.deviceId,label:d.label||'(unlabeled)',base,kind}})}
function renderZoomBar(){const z=state.camera.zoom;$('zoomBar').innerHTML=[0.5,1,2,4,8].map(v=>`<button data-z="${v}" class="${Math.abs(v-z)<0.01?'active':''}">${v}x</button>`).join('');Array.from($('zoomBar').children).forEach(b=>b.onclick=()=>applyCameraZoom(parseFloat(b.dataset.z)))}
function refreshTorchSupport(){const track=state.cameraStream?.getVideoTracks?.()[0];state.camera.torchSupported=!!(track?.getCapabilities?.()?.torch)}
async function applyTorch(on){const track=state.cameraStream?.getVideoTracks?.()[0];if(!track)return false;const caps=track.getCapabilities?.()||{};if(!caps.torch)return false;try{await track.applyConstraints({advanced:[{torch:!!on}]});return true}catch(e){console.warn('torch failed',e);return false}}
async function syncFlashState(){if(!state.camera.torchSupported)return;await applyTorch((state.camera.flash||'auto')==='on')}
async function setFlashMode(m){state.camera.flash=m;localStorage.setItem('sitephoto.flash',m);await syncFlashState();renderFlashBar()}
function renderFlashBar(){const bar=$('flashBar');if(!bar)return;if(!state.camera.torchSupported){bar.innerHTML='<div class="note">FLASH N/A</div>';return}const f=state.camera.flash||'auto';bar.innerHTML=['auto','on','off'].map(v=>`<button data-f="${v}" class="${v===f?'active':''}">${v.toUpperCase()}</button>`).join('');Array.from(bar.children).forEach(b=>b.onclick=()=>setFlashMode(b.dataset.f))}
async function sampleVideoLuminance(){const v=$('video');const w=v.videoWidth,h=v.videoHeight;if(!w)return 128;const c=document.createElement('canvas');c.width=80;c.height=Math.max(1,Math.round(80*h/w));const x=c.getContext('2d');x.drawImage(v,0,0,c.width,c.height);const data=x.getImageData(0,0,c.width,c.height).data;let sum=0,n=0;for(let i=0;i<data.length;i+=4){sum+=0.299*data[i]+0.587*data[i+1]+0.114*data[i+2];n++}return n?sum/n:128}
async function applyCameraZoom(z){const v=$('video');const lenses=state.camera.lenses||[];if(!lenses.length){alert('No back cameras detected. Close and reopen the camera.');return}let lens=null;const sorted=[...lenses].sort((a,b)=>a.base-b.base);for(const l of sorted)if(l.base<=z+0.001)lens=l;if(!lens)lens=sorted[0];if(z<1){const ultra=lenses.find(l=>l.kind==='ultrawide');if(ultra)lens=ultra;else{alert('Ultrawide lens not available. The 0.5x zoom needs an ultrawide camera.');return}}const digital=z/lens.base;if(lens.deviceId!==state.camera.deviceId){try{if(state.cameraStream)state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:lens.deviceId}}});v.srcObject=state.cameraStream;state.camera.deviceId=lens.deviceId;state.camera.activeLens=lens.kind}catch(e){console.warn('lens switch failed',e);alert('Lens switch failed: '+e.message);return}}else{state.camera.activeLens=lens.kind}const track=state.cameraStream?.getVideoTracks?.()[0];let usedNative=false;if(digital>1.001&&track){const caps=track.getCapabilities?.()||{};if(caps.zoom&&digital>=caps.zoom.min&&digital<=caps.zoom.max){try{await track.applyConstraints({advanced:[{zoom:digital}]});usedNative=true}catch(e){console.warn('native zoom failed',e)}}}else if(track){const caps=track.getCapabilities?.()||{};if(caps.zoom){try{await track.applyConstraints({advanced:[{zoom:caps.zoom.min||1}]})}catch(e){}}}v.style.transform=(!usedNative&&digital>1.001)?`scale(${digital})`:'';v.style.transformOrigin='center center';state.camera.zoom=z;state.camera.digitalFactor=usedNative?1:digital;refreshTorchSupport();renderZoomBar();renderFlashBar();await syncFlashState()}
function closeCamera(){if(state.cameraStream){state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=null}$('cam').classList.remove('show')}
async function capture(){const s=cur();if(!s||!s.started||s.stopped)return alert('Start an active session first.');const v=$('video'),c=$('captureCanvas'),w=v.videoWidth,h=v.videoHeight;if(!w)return;const flash=state.camera.flash||'auto';let triggered=false;if(state.camera.torchSupported){if(flash==='auto'){try{const lum=await sampleVideoLuminance();if(lum<60){triggered=await applyTorch(true);if(triggered)await new Promise(r=>setTimeout(r,250))}}catch(e){}}else if(flash==='on'){if(!await applyTorch(true)){}else{await new Promise(r=>setTimeout(r,150))}}}const z=Math.max(1,state.camera.digitalFactor||1);const sw=w/z,sh=h/z,sx=(w-sw)/2,sy=(h-sh)/2;c.width=Math.min(1280,Math.round(sw));c.height=Math.round(c.width*sh/sw);const ctx=c.getContext('2d');ctx.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.55);if(triggered)await applyTorch(false);$('cam').classList.add('flash');setTimeout(()=>$('cam').classList.remove('flash'),180);closeCamera();const baseSeq=s.photos.length+state.pendingPhotos.length+1;state.pendingPhotos.push({id:uid(),sequenceNumber:baseSeq,timestamp:new Date().toISOString(),imageData:data,thumbnail:data,cameraZoom:state.camera.zoom||1,flashMode:flash});showPhotoLocate()}
function showPhotoLocate(){if(!state.pendingPhotos.length){$('corr').classList.remove('show');return}if(!state.corr)state.corr={point:null,heading:0,drag:false,pending:true,step:'location'};renderLocateBar();$('corr').classList.add('show');draw()}
function renderLocateBar(){const batch=state.pendingPhotos;if(!batch.length){$('corr').classList.remove('show');return}const bar=$('corr');const cor=state.corr||{};const lo=batch[0].sequenceNumber,hi=batch[batch.length-1].sequenceNumber;const seq=lo===hi?`#${lo}`:`#${lo}–${hi}`;const cnt=batch.length;const cntLbl=`${cnt} photo${cnt===1?'':'s'}`;if(cor.step==='direction'){bar.innerHTML=`<b>PHOTO ${seq} · DIRECTION</b><div class="metric">Drag from the pin in the direction the lead photo was facing.${cnt>1?` The other ${cnt-1} photo${cnt>2?'s':''} will appear as bubbles around the lead, no arrows.`:''}</div><div class="row"><button id="locBack">Back</button><button id="locAdd">+ Photo at Same Spot</button><button id="locSkipDir">Skip Direction</button><button id="locSave" class="primary">Save All</button></div>`;$('locBack').onclick=()=>{state.corr={point:null,heading:0,drag:false,pending:true,step:'location'};renderLocateBar();draw()};$('locAdd').onclick=()=>openCamera();$('locSkipDir').onclick=()=>{if(state.corr)state.corr.heading=null;commitPendingBatch()};$('locSave').onclick=commitPendingBatch}else{bar.innerHTML=`<b>PHOTO ${seq} · LOCATION (${cntLbl})</b><div class="metric">Tap on the plan to set the shared location for ${cntLbl}.${cnt===1?' Or take more photos at the same spot first.':''}</div><div class="row"><button id="locAdd">+ Photo at Same Spot</button><button id="locSkip">Skip Location</button><button id="locDiscard" class="danger">Discard Batch</button></div>`;$('locAdd').onclick=()=>openCamera();$('locSkip').onclick=()=>{if(state.corr){state.corr.point=null;state.corr.heading=null}commitPendingBatch()};$('locDiscard').onclick=discardPendingBatch}}

function drawWiz(){const c=$('wizCanvas');if(!c)return;const d=DPR(),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);x.fillStyle='#111';x.fillRect(0,0,r.width,r.height);const w=state.wiz;if(!w.img){x.fillStyle=COLORS.dim;x.font='14px monospace';x.fillText('No image loaded',20,30);return}const scale=Math.min(r.width/w.img.width,r.height/w.img.height),ox=(r.width-w.img.width*scale)/2,oy=(r.height-w.img.height*scale)/2;x.drawImage(w.img,ox,oy,w.img.width*scale,w.img.height*scale);function mark(p,col,txt){if(!p)return;x.fillStyle=col;x.beginPath();x.arc(ox+p.x*scale,oy+p.y*scale,8,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.fillText(txt,ox+p.x*scale+10,oy+p.y*scale-10)}mark(w.a,COLORS.amber,'A');mark(w.b,COLORS.blue,'B');if(w.a&&w.b){x.strokeStyle=COLORS.amber;x.setLineDash([6,4]);x.beginPath();x.moveTo(ox+w.a.x*scale,oy+w.a.y*scale);x.lineTo(ox+w.b.x*scale,oy+w.b.y*scale);x.stroke();x.setLineDash([])}mark(w.anchor,COLORS.red,'ANCHOR');if(w.anchor){const a=rad(w.northDeg-90),sx=ox+w.anchor.x*scale,sy=oy+w.anchor.y*scale;x.strokeStyle=COLORS.red;x.lineWidth=3;x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+Math.cos(a)*55,sy+Math.sin(a)*55);x.stroke();x.fillText('N',sx+Math.cos(a)*65,sy+Math.sin(a)*65)}}
function wizNext(){const w=state.wiz;if(w.step===1&&!w.img)return alert('Import an image first.');if(w.step===2){w.distFt=parseFloat($('distFt')?.value||w.distFt);if(!w.a||!w.b||!w.distFt)return alert('Set A, B and distance.')}if(w.step===3&&!w.anchor)return alert('Set anchor.');if(w.step<4){w.step++;renderWizard();return}saveWizard()}
function saveWizard(){const s=cur(),w=state.wiz;if(!s)return;const distM=w.distFt*0.3048;const ppm=Math.hypot(w.b.x-w.a.x,w.b.y-w.a.y)/distM;const first=s.photos[0];s.floorPlan={imageData:w.imgSrc,pixelsPerMetre:ppm,calibrationDistanceFt:w.distFt,anchorPixelX:w.anchor.x,anchorPixelY:w.anchor.y,anchorLocalX:first?.localX||0,anchorLocalY:first?.localY||0,northDeg:w.northDeg};s.photos.forEach(p=>applyPlanToPhoto(s,p));save();$('wizard').classList.remove('show');renderAll();fitView()}
function loadScript(url){return new Promise((res,rej)=>{const sc=document.createElement('script');sc.src=url;sc.onload=()=>res();sc.onerror=()=>rej(new Error('Failed to load '+url));document.head.appendChild(sc)})}
function loadImage(src,crossOrigin){return new Promise(res=>{const im=new Image();if(crossOrigin)im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=()=>res(null);im.src=src})}
async function fetchOsmStaticMap(lat,lon,zoom,widthPx,heightPx){const lat_rad=lat*Math.PI/180;const n=Math.pow(2,zoom);const xtile=(lon+180)/360*n;const ytile=(1-Math.log(Math.tan(lat_rad)+1/Math.cos(lat_rad))/Math.PI)/2*n;const tilesX=Math.ceil(widthPx/256)+2;const tilesY=Math.ceil(heightPx/256)+2;const startX=Math.floor(xtile-tilesX/2);const startY=Math.floor(ytile-tilesY/2);const c=document.createElement('canvas');c.width=tilesX*256;c.height=tilesY*256;const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);const promises=[];for(let i=0;i<tilesX;i++){for(let j=0;j<tilesY;j++){const tx=startX+i,ty=startY+j;if(tx<0||ty<0||tx>=n||ty>=n)continue;promises.push(loadImage(`https://tile.openstreetmap.org/${zoom}/${tx}/${ty}.png`,true).then(im=>{if(im)ctx.drawImage(im,i*256,j*256)}))}}await Promise.all(promises);const centerOffsetX=(xtile-startX)*256;const centerOffsetY=(ytile-startY)*256;const cropX=centerOffsetX-widthPx/2;const cropY=centerOffsetY-heightPx/2;const out=document.createElement('canvas');out.width=widthPx;out.height=heightPx;const octx=out.getContext('2d');octx.fillStyle='#fff';octx.fillRect(0,0,widthPx,heightPx);octx.drawImage(c,cropX,cropY,widthPx,heightPx,0,0,widthPx,heightPx);octx.save();octx.translate(widthPx/2,heightPx/2);const r=Math.max(20,Math.min(widthPx,heightPx)*0.04);octx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5;const rr=i%2===0?r:r*0.42;const x=Math.cos(a)*rr,y=Math.sin(a)*rr;if(i===0)octx.moveTo(x,y);else octx.lineTo(x,y)}octx.closePath();octx.fillStyle='#c0392b';octx.fill();octx.lineWidth=Math.max(2,r*0.12);octx.strokeStyle='#fff';octx.stroke();octx.restore();octx.fillStyle='rgba(255,255,255,0.85)';octx.fillRect(widthPx-220,heightPx-26,220,26);octx.fillStyle='#333';octx.font='bold 11px sans-serif';octx.textAlign='right';octx.textBaseline='middle';octx.fillText('© OpenStreetMap contributors',widthPx-8,heightPx-13);return out.toDataURL('image/jpeg',0.9)}
async function renderPlanCanvas(s,widthPx,heightPx){const c=document.createElement('canvas');c.width=widthPx;c.height=heightPx;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,widthPx,heightPx);const planMode=!!(s?.floorPlan);let planImg=null;if(planMode&&s.floorPlan.imageData)planImg=await loadImage(s.floorPlan.imageData);let bounds;if(planMode&&planImg){bounds={minX:0,minY:0,maxX:planImg.width,maxY:planImg.height}}else{const pts=(s.photos||[]).filter(p=>p.localX!=null).map(p=>metricToScreen(p.localX,p.localY));if(!pts.length)return null;const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);bounds={minX:Math.min(...xs)-150,minY:Math.min(...ys)-150,maxX:Math.max(...xs)+150,maxY:Math.max(...ys)+150}}const padding=30;const w=bounds.maxX-bounds.minX,h=bounds.maxY-bounds.minY;const sc=Math.min((widthPx-2*padding)/w,(heightPx-2*padding)/h);const tx=padding+((widthPx-2*padding)-w*sc)/2-bounds.minX*sc;const ty=padding+((heightPx-2*padding)-h*sc)/2-bounds.minY*sc;x.save();x.translate(tx,ty);x.scale(sc,sc);if(planMode&&planImg){x.drawImage(planImg,0,0)}else{x.strokeStyle='#ccc';x.lineWidth=1/sc;const step=40,gx=Math.floor(bounds.minX/step)*step,gy=Math.floor(bounds.minY/step)*step;for(let i=gx;i<=bounds.maxX;i+=step){x.beginPath();x.moveTo(i,bounds.minY);x.lineTo(i,bounds.maxY);x.stroke()}for(let i=gy;i<=bounds.maxY;i+=step){x.beginPath();x.moveTo(bounds.minX,i);x.lineTo(bounds.maxX,i);x.stroke()}x.strokeStyle='#888';x.beginPath();x.moveTo(bounds.minX,0);x.lineTo(bounds.maxX,0);x.stroke();x.beginPath();x.moveTo(0,bounds.minY);x.lineTo(0,bounds.maxY);x.stroke()}const bs=state.ui.bubbleScale||1;const primaryR=13*bs;const secR=9*bs;const origPlanImg=state.planImg;if(planMode)state.planImg=planImg;const markers=buildMarkers(s,{primaryR,secR});state.planImg=origPlanImg;markers.forEach(m=>drawExportMarker(x,sc,m,primaryR,secR));x.restore();return c.toDataURL('image/jpeg',0.85)}
function drawExportMarker(x,sourceScale,m,primaryR,secR){const photo=m.photo,bearing=m.bearing,isPrimary=m.isPrimary;const source=photo.positionSource||'none';x.save();x.translate(m.x,m.y);const color=source==='manual'?'#d4820a':source==='gps'?'#1a6b5c':source==='none'?'#8fa3b8':'#1a6b5c';x.strokeStyle=color;x.fillStyle=color;x.lineWidth=2/sourceScale;const radius=isPrimary?primaryR:secR;if(bearing!=null&&isPrimary){const a=rad(bearing-90);const arrowLen=primaryR*2.46,tip=primaryR*2.92,base=primaryR*2;x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(a)*arrowLen,Math.sin(a)*arrowLen);x.stroke();x.beginPath();x.moveTo(Math.cos(a)*tip,Math.sin(a)*tip);x.lineTo(Math.cos(a+0.45)*base,Math.sin(a+0.45)*base);x.lineTo(Math.cos(a-0.45)*base,Math.sin(a-0.45)*base);x.closePath();x.fill()}x.beginPath();x.arc(0,0,radius,0,Math.PI*2);x.fill();const text=String(photo.sequenceNumber);let fs=radius*1.6;x.font=`bold ${fs}px sans-serif`;const tw=radius*1.55;const measured=x.measureText(text);if(measured.width>tw){fs=fs*(tw/measured.width);x.font=`bold ${fs}px sans-serif`}x.fillStyle='#fff';x.textAlign='center';x.textBaseline='middle';x.fillText(text,0,0);x.restore()}
async function exportPdf(){const s=cur();if(!s)return alert('No project selected.');if(!s.photos.length)return alert('No photos in this project.');const btn=$('downloadPdf');const orig=btn.textContent;btn.disabled=true;btn.textContent='Building PDF…';try{if(!window.jspdf)await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');const {jsPDF}=window.jspdf;const pdf=new jsPDF({unit:'in',format:'letter'});const pageW=8.5,pageH=11,margin=0.5;pdf.setFont('helvetica','bold');pdf.setFontSize(14);pdf.text(s.projectName||s.name||'Project',margin,margin+0.2);pdf.setFont('helvetica','normal');pdf.setFontSize(9);let yy=margin+0.45;if(s.projectGps){pdf.text(`GPS: ${s.projectGps.lat.toFixed(5)}, ${s.projectGps.lon.toFixed(5)} ±${(s.projectGps.accuracy*3.28084).toFixed(1)} ft`,margin,yy);yy+=0.16}if(s.projectAddress){const lines=pdf.splitTextToSize(s.projectAddress,pageW-2*margin);lines.forEach(l=>{pdf.text(l,margin,yy);yy+=0.14})}if(s.startedAt){pdf.text(`Started: ${new Date(s.startedAt).toLocaleString()}`,margin,yy);yy+=0.16}pdf.text(`${s.photos.length} photos`,margin,yy);yy+=0.2;const dpi=150;const mapAreaW=pageW-2*margin;const mapAreaH=pageH-yy-margin;if(s.projectGps){btn.textContent='Loading map…';try{const mapUrl=await fetchOsmStaticMap(s.projectGps.lat,s.projectGps.lon,17,Math.round(mapAreaW*dpi),Math.round(mapAreaH*dpi));pdf.addImage(mapUrl,'JPEG',margin,yy,mapAreaW,mapAreaH)}catch(e){console.warn('map render failed',e);pdf.text('(map tiles unavailable)',margin,yy+0.3)}}else{pdf.text('(no GPS recorded for this project)',margin,yy+0.3)}btn.textContent='Building PDF…';pdf.addPage();pdf.setFont('helvetica','bold');pdf.setFontSize(12);pdf.text(`${s.projectName||s.name} · Floor Plan`,margin,margin+0.25);const planAreaW=pageW-2*margin;const planTop=margin+0.45;const planAreaH=pageH-planTop-margin;const planUrl=await renderPlanCanvas(s,Math.round(planAreaW*dpi),Math.round(planAreaH*dpi));if(planUrl)pdf.addImage(planUrl,'JPEG',margin,planTop,planAreaW,planAreaH);else pdf.text('(no plan or located photos to display)',margin,planTop+0.3);const photosPerPage=6,cols=2,rows=3,headerH=0.4;const cellW=(pageW-2*margin)/cols;const cellH=(pageH-2*margin-headerH)/rows;const data=[];for(const p of s.photos){const im=await loadImage(p.imageData);data.push({src:p.imageData,w:im?.naturalWidth||1280,h:im?.naturalHeight||960,p})}for(let i=0;i<data.length;i+=photosPerPage){pdf.addPage();pdf.setFont('helvetica','bold');pdf.setFontSize(11);pdf.text(`${s.projectName||s.name} · Photos ${i+1}–${Math.min(i+photosPerPage,data.length)}`,margin,margin+0.25);const items=data.slice(i,i+photosPerPage);items.forEach(({src,w,h,p},idx)=>{const col=idx%cols,row=Math.floor(idx/cols);const cx=margin+col*cellW;const cy=margin+headerH+row*cellH;const padCell=0.06,captionH=0.22;const innerW=cellW-2*padCell;const innerH=cellH-2*padCell-captionH;const aspect=w/h,cellAspect=innerW/innerH;let dW,dH;if(aspect>cellAspect){dW=innerW;dH=innerW/aspect}else{dH=innerH;dW=innerH*aspect}const ox=cx+padCell+(innerW-dW)/2;const oy=cy+padCell+(innerH-dH)/2;pdf.addImage(src,'JPEG',ox,oy,dW,dH);pdf.setFont('helvetica','bold');pdf.setFontSize(10);pdf.text(`#${p.sequenceNumber}`,cx+padCell,cy+cellH-0.06);pdf.setFont('helvetica','normal');pdf.setFontSize(8);pdf.text(new Date(p.timestamp).toLocaleString(),cx+padCell+0.5,cy+cellH-0.06)})}const filename=`${(s.projectName||s.name||'project').replace(/\W+/g,'_')}.pdf`;pdf.save(filename)}catch(e){alert('PDF export failed: '+e.message);console.error(e)}finally{btn.disabled=false;btn.textContent=orig}}
Array.from(document.querySelectorAll('.tabBtn')).forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabBody').forEach(x=>x.classList.remove('show'));$(b.dataset.tab).classList.add('show')});
$('newSession').onclick=newSession;$('startStop').onclick=toggleStart;$('deleteSession').onclick=deleteSession;$('cameraBtn').onclick=openCamera;$('closeCam').onclick=closeCamera;$('shutter').onclick=capture;$('resetView').onclick=fitView;$('planSetup').onclick=openWizard;$('wizClose').onclick=()=>$('wizard').classList.remove('show');$('wizBack').onclick=()=>{if(state.wiz.step>1){state.wiz.step--;renderWizard()}};$('wizNext').onclick=wizNext;$('downloadPdf').onclick=exportPdf;$('vBubblePlus').onclick=()=>adjustBubbles(1.25);$('vBubbleMinus').onclick=()=>adjustBubbles(0.8);$('menuBtn').onclick=()=>$('side').classList.toggle('open');$('photoPreview').onclick=closePhotoPreview;$('vIn').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.4)};$('vOut').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.4)};$('vFit').onclick=fitView;$('vCtr').onclick=()=>{const s=cur();if(!s)return;const last=(s.photos||[]).filter(p=>p.localX!=null||p.planPixelX!=null).slice(-1)[0];if(!last){fitView();return}const r=canvas.getBoundingClientRect();let q;if(s.floorPlan)q=last.planPixelX!=null?{x:last.planPixelX,y:last.planPixelY}:localToPlan(s.floorPlan,last.localX,last.localY);else q=metricToScreen(last.localX,last.localY);const t=state.ui.transform;t.x=r.width/2-q.x*t.scale;t.y=r.height/2-q.y*t.scale;draw()};
