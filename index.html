<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SitePhoto Field Documentation</title>
<style>
:root{
  --navy:#0d1b2a;--navy2:#162032;--navy3:#1e2f42;--steel:#2c4159;--teal:#1a6b5c;--teal2:#22896f;--amber:#d4820a;--amber2:#f0a020;--red:#c0392b;--dim:#8fa3b8;--text:#e8eef5;--line:#334a63;--blue:#2b7fff;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--navy);color:var(--text);font-family:var(--sans)}
body{min-height:100dvh;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.topbar{height:54px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--steel);background:var(--navy2);font-family:var(--mono)}
.brand{font-weight:700;letter-spacing:.04em}.spacer{flex:1}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--steel);background:var(--navy3);color:var(--text);font:12px var(--mono);padding:3px 7px}.badge.rec{background:var(--red);border-color:var(--red)}.badge.gps,.badge.dr{background:var(--teal);border-color:var(--teal2)}.badge.man{background:var(--amber);border-color:var(--amber2);color:#111}.badge.warn{background:transparent;border-color:var(--amber);color:var(--amber2)}
button,input,select{font-family:var(--mono)}button{border:1px solid var(--steel);background:var(--navy3);color:var(--text);padding:9px 10px;border-radius:0;font-size:13px}button.primary{background:var(--teal);border-color:var(--teal2)}button.danger{background:var(--red);border-color:var(--red)}button:disabled{opacity:.45}.content{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}.side{border-right:1px solid var(--steel);background:var(--navy2);overflow:auto}.main{position:relative;min-width:0;min-height:0;background:#07111d}.panel{padding:12px;border-bottom:1px solid var(--steel)}h2,h3{font-family:var(--mono);font-size:14px;margin:0 0 10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font:11px var(--mono);color:var(--dim);text-transform:uppercase}.field input{background:var(--navy);border:1px solid var(--steel);color:var(--text);padding:9px}.session{border:1px solid var(--steel);padding:9px;margin:8px 0;background:var(--navy3);cursor:pointer}.session.active{outline:2px solid var(--teal2)}.session .title{font:13px var(--mono);font-weight:700}.session .meta{font:11px var(--mono);color:var(--dim);margin-top:5px}.tabs{display:flex}.tabs button{flex:1;border-left:0;border-right:1px solid var(--steel)}.tabBody{display:none}.tabBody.show{display:block}.metric{font:12px var(--mono);color:var(--dim)}.hud{position:absolute;left:10px;top:10px;z-index:5;display:grid;grid-template-columns:repeat(2,minmax(92px,auto));gap:6px;pointer-events:none}.hud .box{background:rgba(13,27,42,.85);border:1px solid var(--steel);padding:6px 7px;font:12px var(--mono)}.hud b{color:var(--text)}#planCanvas{width:100%;height:100%;display:block;touch-action:none}.cameraOverlay{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column}.cameraOverlay.show{display:flex}video{width:100%;height:100%;object-fit:cover}.cameraHud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:25}.cameraControls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:25}.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:#eee;color:#111}.flash{animation:flash .18s}@keyframes flash{from{filter:brightness(3)}to{filter:brightness(1)}}.photoItem{border-bottom:1px solid var(--steel);padding:9px}.photoItem .n{font:13px var(--mono);font-weight:700}.thumb{width:72px;height:54px;object-fit:cover;border:1px solid var(--steel);float:right;margin-left:8px}.modal{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.card{width:min(720px,100%);max-height:90dvh;overflow:auto;background:var(--navy2);border:1px solid var(--steel);padding:14px}.wizardCanvas{width:100%;height:430px;border:1px solid var(--steel);background:#111;touch-action:none}.notice{background:var(--navy3);border:1px solid var(--steel);padding:10px;margin:8px 0;font:12px var(--mono);color:var(--dim)}.corr{position:absolute;left:10px;right:10px;bottom:10px;z-index:10;background:rgba(22,32,50,.95);border:1px solid var(--amber);padding:10px;display:none}.corr.show{display:block}.detail{position:absolute;right:10px;top:10px;z-index:6;background:rgba(22,32,50,.96);border:1px solid var(--steel);padding:10px;min-width:220px;font:12px var(--mono);display:none}.detail.show{display:block}.photoPreview{position:absolute;inset:0;z-index:22;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);padding:20px;cursor:pointer}.photoPreview.show{display:flex}.photoPreview img{max-width:100%;max-height:100%;object-fit:contain;border:1px solid var(--steel)}.planCtl{position:absolute;right:10px;top:90px;z-index:6;display:flex;flex-direction:column;gap:6px}.planCtl button{width:46px;height:46px;padding:0;font:13px var(--mono);background:rgba(22,32,50,.92);color:var(--text);border:1px solid var(--steel)}.zoomBar{position:absolute;left:0;right:0;bottom:calc(110px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:25;pointer-events:none}.zoomBar button{pointer-events:auto;width:48px;height:36px;border-radius:18px;background:rgba(0,0,0,.55);color:#fff;border:1px solid #777;font:12px var(--mono)}.zoomBar button.active{background:#fff;color:#111;border-color:#fff}@media(max-width:820px){.content{grid-template-columns:1fr}.side{position:absolute;left:0;top:54px;bottom:0;width:88vw;max-width:360px;z-index:15;transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.mobileOnly{display:inline-flex!important}}.mobileOnly{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><button id="menuBtn" class="mobileOnly">☰</button><div class="brand">SITEPHOTO</div><span id="recBadge" class="badge">IDLE</span><div class="spacer"></div><button id="cameraBtn" class="primary">Camera</button></div>
  <div class="content">
    <aside class="side" id="side">
      <div class="panel"><h2>Sessions</h2><div class="field"><label>Project Name</label><input id="sessionName" placeholder="required" /></div><div class="row"><button id="newSession" class="primary">New</button><button id="startStop">Start</button><button id="deleteSession">Delete</button></div><div id="sessions"></div></div>
      <div class="tabs"><button data-tab="photos" class="tabBtn">Photos</button><button data-tab="plan" class="tabBtn">Plan</button><button data-tab="export" class="tabBtn">Export</button></div>
      <div id="photos" class="tabBody show"><div class="panel"><h3>Photo Index</h3><div id="photoList" class="metric">No photos.</div></div></div>
      <div id="plan" class="tabBody"><div class="panel"><h3>Floor Plan</h3><div class="row"><button id="planSetup">Setup</button><button id="resetView">Fit View</button></div><div id="planStatus" class="notice">No floor plan calibrated. Grid mode active.</div></div></div>
      <div id="export" class="tabBody"><div class="panel"><h3>Session Export</h3><button id="downloadJson">Download JSON</button><button id="downloadCsv">Download CSV</button><div class="notice">PDF export is intentionally left as the next module. This web MVP exports litigation-support data as JSON/CSV.</div></div></div>
    </aside>
    <main class="main"><canvas id="planCanvas"></canvas><div class="detail" id="detail"></div><div class="photoPreview" id="photoPreview"><img id="photoPreviewImg" alt=""></div><div class="planCtl"><button id="vFit" title="Fit View">FIT</button><button id="vIn" title="Zoom In">+</button><button id="vOut" title="Zoom Out">-</button><button id="vCtr" title="Center on Last Photo">CTR</button></div><div class="corr" id="corr"></div></main>
  </div>
</div>
<div class="cameraOverlay" id="cam"><video id="video" playsinline autoplay muted></video><div class="cameraHud" id="cameraHud"></div><div class="zoomBar" id="zoomBar"></div><div class="cameraControls"><button id="closeCam">Close</button><button id="shutter" class="shutter">●</button></div></div>
<div class="modal" id="wizard"><div class="card"><h2>Floor Plan Setup</h2><div id="wizBody"></div><div class="row" style="margin-top:10px"><button id="wizBack">Back</button><button id="wizNext" class="primary">Next</button><button id="wizClose">Close</button></div></div></div>
<canvas id="captureCanvas" style="display:none"></canvas>
<script>
'use strict';
const $=id=>document.getElementById(id); const DPR=()=>window.devicePixelRatio||1; const rad=d=>d*Math.PI/180; const deg=r=>(r*180/Math.PI+360)%360;
const COLORS={navy:'#0d1b2a',navy2:'#162032',navy3:'#1e2f42',steel:'#2c4159',teal:'#1a6b5c',amber:'#d4820a',red:'#c0392b',dim:'#8fa3b8',text:'#e8eef5',blue:'#2b7fff'};
let state={sessions:[],currentId:null,ui:{transform:{x:0,y:0,scale:1},selected:null,tab:'photos'},camera:{zoom:1,deviceId:null,devices:[],lenses:[],digitalFactor:1,activeLens:null},pendingPhotos:[],cameraStream:null,planImg:null,wiz:{step:1,img:null,imgSrc:null,a:null,b:null,distFt:null,anchor:null,northDeg:180},corr:null};
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function nowName(){return new Date().toLocaleString()} function cur(){return state.sessions.find(s=>s.id===state.currentId)||null}
function save(){localStorage.setItem('sitephoto.v1',JSON.stringify({sessions:state.sessions,currentId:state.currentId}))}
function load(){try{const x=JSON.parse(localStorage.getItem('sitephoto.v1')||'{}');state.sessions=x.sessions||[];state.currentId=x.currentId||state.sessions[0]?.id||null}catch(e){}}
function newSession(){const name=$('sessionName').value.trim();if(!name)return alert('Enter a project name first.');const s={id:uid(),name,projectName:name,created:new Date().toISOString(),started:false,stopped:false,photos:[],floorPlan:null,path:[],projectGps:null};state.sessions.unshift(s);state.currentId=s.id;$('sessionName').value='';save();renderAll();fitView()}
function toggleStart(){const s=cur();if(!s)return;if(!s.started){s.started=true;s.stopped=false;const ts=new Date().toISOString();if(!s.startedAt){s.startedAt=ts;if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{s.projectGps={lat:p.coords.latitude,lon:p.coords.longitude,altitude:p.coords.altitude,accuracy:p.coords.accuracy,timestamp:new Date().toISOString()};save();renderAll()},e=>console.warn('start GPS failed',e),{enableHighAccuracy:true,timeout:8000})}else{s.lastResumedAt=ts}}else{s.started=false;s.stopped=true;s.lastStoppedAt=new Date().toISOString()}save();renderAll()}
function deleteSession(){const s=cur();if(!s)return;if(!confirm('Delete current session?'))return;state.sessions=state.sessions.filter(x=>x.id!==s.id);state.currentId=state.sessions[0]?.id||null;save();renderAll();fitView()}
async function openCamera(){try{if(!cur()||!cur().started||cur().stopped)return alert('Start an active session first.');state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=state.cameraStream;$('cam').classList.add('show');try{const all=await navigator.mediaDevices.enumerateDevices();state.camera.devices=all.filter(d=>d.kind==='videoinput')}catch(e){state.camera.devices=[]}state.camera.lenses=classifyLenses(state.camera.devices);state.camera.zoom=1;state.camera.digitalFactor=1;state.camera.deviceId=state.cameraStream.getVideoTracks()[0]?.getSettings?.().deviceId||null;const initial=state.camera.lenses.find(l=>l.deviceId===state.camera.deviceId);state.camera.activeLens=initial?.kind||(state.camera.lenses.find(l=>l.kind==='wide')?.kind||null);if(state.camera.lenses.length&&!initial){const wide=state.camera.lenses.find(l=>l.kind==='wide')||state.camera.lenses[0];try{state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:wide.deviceId}}});$('video').srcObject=state.cameraStream;state.camera.deviceId=wide.deviceId;state.camera.activeLens=wide.kind}catch(e){console.warn('initial wide select failed',e)}}$('video').style.transform='';renderZoomBar()}catch(e){alert('Camera failed: '+e.message)}}
function classifyLenses(devices){const back=devices.filter(d=>/back|rear/i.test(d.label||''));const list=back.length?back:devices.filter(d=>!/front|user/i.test(d.label||''));return list.map(d=>{const l=(d.label||'').toLowerCase();let base=1,kind='wide';if(/ultra/.test(l)){base=0.5;kind='ultrawide'}else if(/tele/.test(l)){base=5;kind='telephoto'}return{deviceId:d.deviceId,label:d.label||'(unlabeled)',base,kind}})}
function renderZoomBar(){const z=state.camera.zoom;$('zoomBar').innerHTML=[0.5,1,2,4,8].map(v=>`<button data-z="${v}" class="${Math.abs(v-z)<0.01?'active':''}">${v}x</button>`).join('');Array.from($('zoomBar').children).forEach(b=>b.onclick=()=>applyCameraZoom(parseFloat(b.dataset.z)))}
async function applyCameraZoom(z){const v=$('video');const lenses=state.camera.lenses||[];if(!lenses.length){alert('No back cameras detected. Close and reopen the camera.');return}let lens=null;const sorted=[...lenses].sort((a,b)=>a.base-b.base);for(const l of sorted)if(l.base<=z+0.001)lens=l;if(!lens)lens=sorted[0];if(z<1){const ultra=lenses.find(l=>l.kind==='ultrawide');if(ultra)lens=ultra;else{alert('Ultrawide lens not available. The 0.5x zoom needs an ultrawide camera.');return}}const digital=z/lens.base;if(lens.deviceId!==state.camera.deviceId){try{if(state.cameraStream)state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:lens.deviceId}}});v.srcObject=state.cameraStream;state.camera.deviceId=lens.deviceId;state.camera.activeLens=lens.kind}catch(e){console.warn('lens switch failed',e);alert('Lens switch failed: '+e.message);return}}else{state.camera.activeLens=lens.kind}const track=state.cameraStream?.getVideoTracks?.()[0];let usedNative=false;if(digital>1.001&&track){const caps=track.getCapabilities?.()||{};if(caps.zoom&&digital>=caps.zoom.min&&digital<=caps.zoom.max){try{await track.applyConstraints({advanced:[{zoom:digital}]});usedNative=true}catch(e){console.warn('native zoom failed',e)}}}else if(track){const caps=track.getCapabilities?.()||{};if(caps.zoom){try{await track.applyConstraints({advanced:[{zoom:caps.zoom.min||1}]})}catch(e){}}}v.style.transform=(!usedNative&&digital>1.001)?`scale(${digital})`:'';v.style.transformOrigin='center center';state.camera.zoom=z;state.camera.digitalFactor=usedNative?1:digital;renderZoomBar()}
function closeCamera(){if(state.cameraStream){state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=null}$('cam').classList.remove('show')}
function capture(){const s=cur();if(!s||!s.started||s.stopped)return alert('Start an active session first.');const v=$('video'),c=$('captureCanvas'),w=v.videoWidth,h=v.videoHeight;if(!w)return;const z=Math.max(1,state.camera.digitalFactor||1);const sw=w/z,sh=h/z,sx=(w-sw)/2,sy=(h-sh)/2;c.width=Math.min(1280,Math.round(sw));c.height=Math.round(c.width*sh/sw);const ctx=c.getContext('2d');ctx.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.55);$('cam').classList.add('flash');setTimeout(()=>$('cam').classList.remove('flash'),180);closeCamera();const baseSeq=s.photos.length+state.pendingPhotos.length+1;state.pendingPhotos.push({id:uid(),sequenceNumber:baseSeq,timestamp:new Date().toISOString(),imageData:data,thumbnail:data,cameraZoom:state.camera.zoom||1});showPhotoLocate()}
function showPhotoLocate(){if(!state.pendingPhotos.length){$('corr').classList.remove('show');return}if(!state.corr)state.corr={point:null,heading:0,drag:false,pending:true,step:'location'};renderLocateBar();$('corr').classList.add('show');draw()}
function renderLocateBar(){const batch=state.pendingPhotos;if(!batch.length){$('corr').classList.remove('show');return}const bar=$('corr');const cor=state.corr||{};const lo=batch[0].sequenceNumber,hi=batch[batch.length-1].sequenceNumber;const seq=lo===hi?`#${lo}`:`#${lo}–${hi}`;const cnt=batch.length;const cntLbl=`${cnt} photo${cnt===1?'':'s'}`;if(cor.step==='direction'){bar.innerHTML=`<b>PHOTO ${seq} · DIRECTION</b><div class="metric">Drag from the pin in the direction the lead photo was facing.${cnt>1?` The other ${cnt-1} photo${cnt>2?'s':''} will appear as bubbles around the lead, no arrows.`:''}</div><div class="row"><button id="locBack">Back</button><button id="locAdd">+ Photo at Same Spot</button><button id="locSkipDir">Skip Direction</button><button id="locSave" class="primary">Save All</button></div>`;$('locBack').onclick=()=>{state.corr={point:null,heading:0,drag:false,pending:true,step:'location'};renderLocateBar();draw()};$('locAdd').onclick=()=>openCamera();$('locSkipDir').onclick=()=>{if(state.corr)state.corr.heading=null;commitPendingBatch()};$('locSave').onclick=commitPendingBatch}else{bar.innerHTML=`<b>PHOTO ${seq} · LOCATION (${cntLbl})</b><div class="metric">Tap on the plan to set the shared location for ${cntLbl}.${cnt===1?' Or take more photos at the same spot first.':''}</div><div class="row"><button id="locAdd">+ Photo at Same Spot</button><button id="locSkip">Skip Location</button><button id="locDiscard" class="danger">Discard Batch</button></div>`;$('locAdd').onclick=()=>openCamera();$('locSkip').onclick=()=>{if(state.corr){state.corr.point=null;state.corr.heading=null}commitPendingBatch()};$('locDiscard').onclick=discardPendingBatch}}
function discardPendingBatch(){if(!confirm('Discard all '+state.pendingPhotos.length+' photo(s)?'))return;state.pendingPhotos=[];state.corr=null;$('corr').classList.remove('show');draw()}
function commitPendingBatch(){const s=cur(),batch=state.pendingPhotos;if(!s||!batch.length)return;const cor=state.corr||{};const point=cor.point||null;let localX=null,localY=null,planPixelX=null,planPixelY=null,positionSource='none';if(point){if(s.floorPlan){const loc=planToLocal(s.floorPlan,point.x,point.y);localX=loc.x;localY=loc.y;planPixelX=point.x;planPixelY=point.y}else{const m=screenToMetric(point.x,point.y);localX=m.x;localY=m.y}positionSource='manual'}const groupId=batch.length>1?uid():null;const heading=(point&&cor.heading!=null)?cor.heading:null;batch.forEach((pp,i)=>{s.photos.push({id:pp.id,sequenceNumber:pp.sequenceNumber,timestamp:pp.timestamp,localX,localY,heading:i===0?heading:null,positionSource,cameraZoom:pp.cameraZoom??1,imageData:pp.imageData,thumbnail:pp.thumbnail,planPixelX,planPixelY,groupId,isPrimary:i===0})});if(point)s.path.push({x:localX,y:localY,t:batch[0].timestamp,manual:true});state.pendingPhotos=[];state.corr=null;$('corr').classList.remove('show');save();renderAll();draw()}
function applyPlanToPhoto(s,p){if(!s.floorPlan)return;const q=localToPlan(s.floorPlan,p.localX,p.localY);p.planPixelX=q.x;p.planPixelY=q.y}
function localToPlan(fp,localX,localY){const dx=localX-fp.anchorLocalX,dy=localY-fp.anchorLocalY,th=rad(fp.northDeg);const imgDX=dx*Math.cos(th)+dy*Math.sin(th);const imgDY=-(-dx*Math.sin(th)+dy*Math.cos(th));return{x:fp.anchorPixelX+imgDX*fp.pixelsPerMetre,y:fp.anchorPixelY+imgDY*fp.pixelsPerMetre}}
function planToLocal(fp,px,py){const imgDX=px-fp.anchorPixelX,imgDY=-(py-fp.anchorPixelY),th=rad(fp.northDeg);const dX=imgDX*Math.cos(th)-imgDY*Math.sin(th);const dY=imgDX*Math.sin(th)+imgDY*Math.cos(th);return{x:fp.anchorLocalX+dX/fp.pixelsPerMetre,y:fp.anchorLocalY+dY/fp.pixelsPerMetre}}
function renderAll(){renderSessions();renderPhotos();renderHud();renderPlanStatus();const s=cur();const live=s?.started&&!s?.stopped;$('recBadge').textContent=live?'REC':'IDLE';$('recBadge').className=live?'badge rec':'badge';$('startStop').textContent=live?'Stop':(s?.startedAt?'Resume':'Start');loadPlanImage().then(draw)}
function renderSessions(){const el=$('sessions');el.innerHTML='';state.sessions.forEach(s=>{const d=document.createElement('div');d.className='session '+(s.id===state.currentId?'active':'');const gps=s.projectGps?`GPS ${s.projectGps.lat.toFixed(5)}, ${s.projectGps.lon.toFixed(5)} ±${fmt(s.projectGps.accuracy*3.28084)}ft`:s.started?'GPS pending…':'GPS not yet recorded';const live=s.started&&!s.stopped;const stat=live?'<span class="badge rec">REC</span>':s.startedAt?'<span class="badge warn">PAUSED</span>':'';d.innerHTML=`<div class="title">${esc(s.projectName||s.name)} ${stat}</div><div class="meta">${s.photos.length} photos · ${s.floorPlan?'plan calibrated':'grid mode'}<br>${new Date(s.created).toLocaleString()}<br>${gps}</div>`;d.onclick=()=>{state.currentId=s.id;save();renderAll();fitView();if(innerWidth<820)$('side').classList.remove('open')};el.appendChild(d)})}
function renderPhotos(){const s=cur(),el=$('photoList');if(!s||!s.photos.length){el.textContent='No photos.';return}el.innerHTML=s.photos.map(p=>{const src=p.positionSource||'none';const cls=src==='manual'?'man':src==='gps'?'gps':src==='none'?'warn':'dr';const lbl=src==='manual'?'MAN':src==='gps'?'GPS':src==='none'?'NO LOC':'DR';const loc=src==='none'?'(no location)':'X '+fmt(p.localX*3.28084)+'ft · Y '+fmt(p.localY*3.28084)+'ft';const grp=p.groupId?` <span class="badge">GRP${p.isPrimary?'★':''}</span>`:'';return `<div class="photoItem"><img class="thumb" src="${p.thumbnail}"><div class="n">#${p.sequenceNumber} <span class="badge ${cls}">${lbl}</span>${grp}</div><div>${new Date(p.timestamp).toLocaleString()}</div><div>${loc}</div><div>${p.heading==null?'(no direction)':'H '+fmt(p.heading)+'°'} · ${fmt(p.cameraZoom||1)}x</div></div>`}).join('')}
function renderHud(){const cam=state.camera;const lensTxt=cam.activeLens?`<div class="badge">LENS <b>${cam.activeLens.toUpperCase()}${cam.digitalFactor>1.001?' · DIG '+fmt(cam.digitalFactor)+'x':''}</b></div>`:'';const ch=$('cameraHud');if(ch)ch.innerHTML=lensTxt}
function renderPlanStatus(){const s=cur(),fp=s?.floorPlan;$('planStatus').textContent=fp?`Calibrated: ${fmt(fp.pixelsPerMetre/3.28084)} px/ft · northDeg ${fmt(fp.northDeg)} · anchor ${fmt(fp.anchorPixelX)}, ${fmt(fp.anchorPixelY)}`:'No floor plan calibrated. Grid mode active.'}
function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))} function fmt(x){return x==null||Number.isNaN(x)?'—':Number(x).toFixed(1)}
const canvas=$('planCanvas'),ctx=canvas.getContext('2d');function resize(){const r=canvas.getBoundingClientRect(),d=DPR();canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);draw()}window.addEventListener('resize',resize);
async function loadPlanImage(){const s=cur();if(!s?.floorPlan?.imageData){state.planImg=null;return} if(state.planImg?.src===s.floorPlan.imageData)return;state.planImg=new Image();state.planImg.src=s.floorPlan.imageData;await state.planImg.decode().catch(()=>{})}
function draw(){const r=canvas.getBoundingClientRect(),d=DPR(),t=state.ui.transform;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#07111d';ctx.fillRect(0,0,r.width,r.height);ctx.save();ctx.translate(t.x,t.y);ctx.scale(t.scale,t.scale);const s=cur(); if(s?.floorPlan&&state.planImg){ctx.drawImage(state.planImg,0,0);drawPlanOverlays(s)}else drawMetric(s,r);ctx.restore();drawNorth(r);drawScaleBar(r);drawSelected()}
function drawMetric(s,r){drawGrid(-2000,-2000,4000,4000,40/state.ui.transform.scale);buildMarkers(s).forEach(m=>drawPhotoMarker({x:m.x,y:m.y},m.bearing,m.photo.sequenceNumber,m.photo.positionSource,m.isPrimary))}
function metricToScreen(x,y){return{x:x*40,y:-y*40}}function screenToMetric(x,y){return{x:x/40,y:-y/40}}
function drawGrid(x,y,w,h,step){step=Math.max(5,step);ctx.strokeStyle='rgba(143,163,184,.22)';ctx.lineWidth=1/state.ui.transform.scale;ctx.beginPath();for(let i=-2000;i<=2000;i+=step){ctx.moveTo(i,-2000);ctx.lineTo(i,2000);ctx.moveTo(-2000,i);ctx.lineTo(2000,i)}ctx.stroke();ctx.strokeStyle='rgba(232,238,245,.5)';ctx.beginPath();ctx.moveTo(-2000,0);ctx.lineTo(2000,0);ctx.moveTo(0,-2000);ctx.lineTo(0,2000);ctx.stroke()}
function drawPlanOverlays(s){buildMarkers(s).forEach(m=>drawPhotoMarker({x:m.x,y:m.y},m.bearing,m.photo.sequenceNumber,m.photo.positionSource,m.isPrimary))}
function buildMarkers(s){const planMode=!!(s?.floorPlan&&state.planImg);const groups=new Map();(s?.photos||[]).forEach(p=>{if(p.localX==null&&p.planPixelX==null)return;const gid=p.groupId||p.id;if(!groups.has(gid))groups.set(gid,[]);groups.get(gid).push(p)});const out=[];groups.forEach(group=>{group.sort((a,b)=>a.sequenceNumber-b.sequenceNumber);const primary=group.find(g=>g.isPrimary)||group[0];let baseQ;if(planMode)baseQ=primary.planPixelX!=null?{x:primary.planPixelX,y:primary.planPixelY}:localToPlan(s.floorPlan,primary.localX,primary.localY);else baseQ=metricToScreen(primary.localX,primary.localY);const bearing=primary.heading==null?null:(planMode?primary.heading-s.floorPlan.northDeg:primary.heading);out.push({photo:primary,x:baseQ.x,y:baseQ.y,isPrimary:true,bearing});const secs=group.filter(g=>g!==primary);const primaryR=13,secR=9,firstGap=primaryR+secR-2,stepGap=secR*2-2;const headDeg=primary.heading==null?0:primary.heading;const layoutBearing=planMode?headDeg-s.floorPlan.northDeg:headDeg;const oppA=rad(layoutBearing+90);const dx=Math.cos(oppA),dy=Math.sin(oppA);secs.forEach((p,i)=>{const dist=firstGap+i*stepGap;out.push({photo:p,x:baseQ.x+dx*dist,y:baseQ.y+dy*dist,isPrimary:false,bearing:null})})});return out}
function drawPhotoMarker(q,bearing,n,source,isPrimary){ctx.save();ctx.translate(q.x,q.y);const color=source==='manual'?COLORS.amber:source==='gps'?COLORS.teal:source==='none'?COLORS.dim:COLORS.teal;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2/state.ui.transform.scale;const radius=isPrimary?13:9;if(bearing!=null&&isPrimary){const a=rad(bearing-90);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*32,Math.sin(a)*32);ctx.stroke();ctx.beginPath();ctx.moveTo(Math.cos(a)*38,Math.sin(a)*38);ctx.lineTo(Math.cos(a+.45)*26,Math.sin(a+.45)*26);ctx.lineTo(Math.cos(a-.45)*26,Math.sin(a-.45)*26);ctx.closePath();ctx.fill()}ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.fill();const text=String(n);const family=getComputedStyle(document.body).fontFamily;let fs=radius*1.6;ctx.font=`bold ${fs}px ${family}`;const targetW=radius*1.55;const m=ctx.measureText(text);if(m.width>targetW){fs=fs*(targetW/m.width);ctx.font=`bold ${fs}px ${family}`}ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,0,0);ctx.restore()}
function drawNorth(r){ctx.save();ctx.translate(r.width-44,44);ctx.fillStyle=COLORS.text;ctx.strokeStyle=COLORS.text;ctx.font='12px monospace';ctx.textAlign='center';ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(8,6);ctx.lineTo(0,2);ctx.lineTo(-8,6);ctx.closePath();ctx.fill();ctx.fillText('N',0,22);ctx.restore()}
function drawScaleBar(r){ctx.save();ctx.translate(18,r.height-28);ctx.strokeStyle=COLORS.text;ctx.fillStyle=COLORS.text;ctx.font='12px monospace';const targetMeters=120/(40*state.ui.transform.scale);const ft=nice(targetMeters*3.28084);const px=(ft/3.28084)*40*state.ui.transform.scale;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(px,0);ctx.moveTo(0,-5);ctx.lineTo(0,5);ctx.moveTo(px,-5);ctx.lineTo(px,5);ctx.stroke();ctx.fillText(ft+' ft',0,-9);ctx.restore()}function nice(x){const a=[1,2,5,10,20,50,100,200,500,1000];return a.find(v=>v>=x)||2000}
function worldToCanvas(x,y){const t=state.ui.transform;return{x:t.x+x*t.scale,y:t.y+y*t.scale}}function canvasToWorld(cx,cy){const t=state.ui.transform;return{x:(cx-t.x)/t.scale,y:(cy-t.y)/t.scale}}
function drawSelected(){const p=state.ui.selected;const d=$('detail');if(!p){d.classList.remove('show');return}d.classList.add('show');const src=p.positionSource||'none';const cls=src==='manual'?'man':src==='gps'?'gps':src==='none'?'warn':'dr';const grp=p.groupId?(p.isPrimary?' · GROUP LEAD':' · GROUP BUBBLE'):'';d.innerHTML=`<b>PHOTO #${p.sequenceNumber}</b>${grp}<br>${new Date(p.timestamp).toLocaleString()}<br><span class="badge ${cls}">${src.toUpperCase()}</span><br>${p.heading==null?'(no direction)':'H '+fmt(p.heading)+'°'} · ${fmt(p.cameraZoom||1)}x<br>${src==='none'?'no location':'X '+fmt(p.localX*3.28084)+'ft Y '+fmt(p.localY*3.28084)+'ft'}`}
let touch=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId); if(state.corr){handleCorrectionDown(e);return} touch={id:e.pointerId,x:e.clientX,y:e.clientY,tx:state.ui.transform.x,ty:state.ui.transform.y,drag:false}});canvas.addEventListener('pointermove',e=>{if(state.corr){handleCorrectionMove(e);return} if(!touch||touch.id!==e.pointerId)return;state.ui.transform.x=touch.tx+(e.clientX-touch.x);state.ui.transform.y=touch.ty+(e.clientY-touch.y);touch.drag=true;draw()});canvas.addEventListener('pointerup',e=>{if(state.corr){handleCorrectionUp(e);return} if(touch&&!touch.drag)selectAt(e);touch=null});canvas.addEventListener('wheel',e=>{e.preventDefault();const ratio=e.deltaY<0?1.1:.9;zoomAt(e.clientX,e.clientY,ratio)},{passive:false});
let lastPinch=null;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&!state.corr){e.preventDefault();const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),mid={x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};if(lastPinch)zoomAt(mid.x,mid.y,dist/lastPinch);lastPinch=dist}},{passive:false});canvas.addEventListener('touchend',()=>lastPinch=null);
function zoomAt(cx,cy,ratio){const rect=canvas.getBoundingClientRect();cx-=rect.left;cy-=rect.top;const t=state.ui.transform;ratio=Math.max(.2,Math.min(5,ratio));const ns=Math.min(Math.max(t.scale*ratio,.1),20);ratio=ns/t.scale;t.x=cx+(t.x-cx)*ratio;t.y=cy+(t.y-cy)*ratio;t.scale=ns;draw()}
function selectAt(e){const rect=canvas.getBoundingClientRect(),w=canvasToWorld(e.clientX-rect.left,e.clientY-rect.top),s=cur();let best=null,bd=20/state.ui.transform.scale;buildMarkers(s).forEach(m=>{const d=Math.hypot(m.x-w.x,m.y-w.y);if(d<bd){bd=d;best=m.photo}});state.ui.selected=best;showPhotoPreview(best);draw()}
function showPhotoPreview(p){const pv=$('photoPreview'),im=$('photoPreviewImg');if(!p){pv.classList.remove('show');im.removeAttribute('src');return}im.src=p.imageData||p.thumbnail||'';pv.classList.add('show')}
function closePhotoPreview(){state.ui.selected=null;showPhotoPreview(null);draw()}
function fitView(){const r=canvas.getBoundingClientRect(),s=cur();let pts=[];if(s?.floorPlan&&state.planImg){pts=[{x:0,y:0},{x:state.planImg.width,y:state.planImg.height}]}else{pts=(s?.photos||[]).filter(p=>p.localX!=null).map(p=>metricToScreen(p.localX,p.localY))}if(!pts.length){state.ui.transform={x:r.width/2,y:r.height/2,scale:1};draw();return}const minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));const scale=Math.min((r.width-80)/Math.max(1,maxX-minX),(r.height-80)/Math.max(1,maxY-minY));state.ui.transform={scale:Math.min(Math.max(scale,.1),4),x:r.width/2-(minX+maxX)/2*Math.min(Math.max(scale,.1),4),y:r.height/2-(minY+maxY)/2*Math.min(Math.max(scale,.1),4)};draw()}
function handleCorrectionDown(e){const rect=canvas.getBoundingClientRect(),w=canvasToWorld(e.clientX-rect.left,e.clientY-rect.top);const cor=state.corr;if(!cor)return;if(state.pendingPhotos.length){if(cor.step==='direction'){cor.point=w;cor.heading=0;drawTempCorrection()}else{cor.point=w;cor.step='direction';renderLocateBar();drawTempCorrection()}cor.drag=true;return}cor.point=w;cor.drag=true}
function handleCorrectionMove(e){const cor=state.corr;if(!cor||!cor.point||!cor.drag)return;const rect=canvas.getBoundingClientRect(),w=canvasToWorld(e.clientX-rect.left,e.clientY-rect.top),p=cor.point;let angle=deg(Math.atan2(w.y-p.y,w.x-p.x))+90;const s=cur();if(s?.floorPlan)angle=(angle+s.floorPlan.northDeg+360)%360;cor.heading=angle;drawTempCorrection()}
function handleCorrectionUp(e){if(state.corr)state.corr.drag=false}
function drawTempCorrection(){draw();const p=state.corr?.point,s=cur();if(!p)return;ctx.save();ctx.translate(state.ui.transform.x,state.ui.transform.y);ctx.scale(state.ui.transform.scale,state.ui.transform.scale);const head=state.corr.heading;const bearing=head==null?null:(s?.floorPlan?head-s.floorPlan.northDeg:head);drawPhotoMarker(p,bearing,'?','manual',true);ctx.restore()}
function openWizard(){state.wiz={step:1,img:null,imgSrc:null,a:null,b:null,distFt:null,anchor:null,northDeg:180};$('wizard').classList.add('show');renderWizard()}function renderWizard(){const w=state.wiz,body=$('wizBody');$('wizBack').disabled=w.step===1;$('wizNext').textContent=w.step===4?'Save':'Next';if(w.step===1)body.innerHTML=`<div class="notice">Import PNG/JPG. Web version intentionally uses images only; iOS version should add PDFKit rendering.</div><input type="file" id="planFile" accept="image/png,image/jpeg"><canvas id="wizCanvas" class="wizardCanvas"></canvas>`;if(w.step===2)body.innerHTML=`<div class="notice">Tap calibration Point A, then Point B. Enter the real distance in feet.</div><canvas id="wizCanvas" class="wizardCanvas"></canvas><div class="field"><label>Known distance, feet</label><input id="distFt" type="number" step="0.01" value="${w.distFt||''}"></div>`;if(w.step===3)body.innerHTML=`<div class="notice">Tap Photo #1 location as anchor. Set northDeg: degrees clockwise from image +Y/down direction to true north. North-up plan usually = 180.</div><canvas id="wizCanvas" class="wizardCanvas"></canvas><div class="field"><label>northDeg</label><input id="northDeg" type="range" min="0" max="359" value="${w.northDeg}"><input id="northDegText" type="number" value="${w.northDeg}"></div>`;if(w.step===4){const distM=w.distFt?w.distFt*0.3048:null;let ppm=w.a&&w.b&&distM?Math.hypot(w.b.x-w.a.x,w.b.y-w.a.y)/distM:null;body.innerHTML=`<div class="notice">Scale: ${ppm?fmt(ppm/3.28084)+' px/ft':'not set'}<br>Anchor: ${w.anchor?'set':'not set'}<br>northDeg: ${fmt(w.northDeg)}<br>Save will recompute all photo plan coordinates.</div>`}setTimeout(bindWizard,0)}
function bindWizard(){const c=$('wizCanvas');if($('planFile'))$('planFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{state.wiz.imgSrc=rd.result;state.wiz.img=new Image();state.wiz.img.onload=()=>drawWiz();state.wiz.img.src=rd.result};rd.readAsDataURL(f)};if(c){c.onclick=e=>{const p=wizPoint(e);const w=state.wiz;if(w.step===2){if(!w.a)w.a=p;else if(!w.b)w.b=p;else{w.a=p;w.b=null}} if(w.step===3)w.anchor=p;drawWiz()};drawWiz()}if($('distFt'))$('distFt').oninput=e=>state.wiz.distFt=parseFloat(e.target.value);if($('northDeg')){$('northDeg').oninput=e=>{$('northDegText').value=e.target.value;state.wiz.northDeg=parseFloat(e.target.value);drawWiz()};$('northDegText').oninput=e=>{$('northDeg').value=e.target.value;state.wiz.northDeg=parseFloat(e.target.value)||0;drawWiz()}}}
function wizPoint(e){const c=$('wizCanvas'),r=c.getBoundingClientRect(),img=state.wiz.img,scale=Math.min(r.width/img.width,r.height/img.height),ox=(r.width-img.width*scale)/2,oy=(r.height-img.height*scale)/2;return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
function drawWiz(){const c=$('wizCanvas');if(!c)return;const d=DPR(),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);x.fillStyle='#111';x.fillRect(0,0,r.width,r.height);const w=state.wiz;if(!w.img){x.fillStyle=COLORS.dim;x.font='14px monospace';x.fillText('No image loaded',20,30);return}const scale=Math.min(r.width/w.img.width,r.height/w.img.height),ox=(r.width-w.img.width*scale)/2,oy=(r.height-w.img.height*scale)/2;x.drawImage(w.img,ox,oy,w.img.width*scale,w.img.height*scale);function mark(p,col,txt){if(!p)return;x.fillStyle=col;x.beginPath();x.arc(ox+p.x*scale,oy+p.y*scale,8,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.fillText(txt,ox+p.x*scale+10,oy+p.y*scale-10)}mark(w.a,COLORS.amber,'A');mark(w.b,COLORS.blue,'B');if(w.a&&w.b){x.strokeStyle=COLORS.amber;x.setLineDash([6,4]);x.beginPath();x.moveTo(ox+w.a.x*scale,oy+w.a.y*scale);x.lineTo(ox+w.b.x*scale,oy+w.b.y*scale);x.stroke();x.setLineDash([])}mark(w.anchor,COLORS.red,'ANCHOR');if(w.anchor){const a=rad(w.northDeg-90),sx=ox+w.anchor.x*scale,sy=oy+w.anchor.y*scale;x.strokeStyle=COLORS.red;x.lineWidth=3;x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+Math.cos(a)*55,sy+Math.sin(a)*55);x.stroke();x.fillText('N',sx+Math.cos(a)*65,sy+Math.sin(a)*65)}}
function wizNext(){const w=state.wiz;if(w.step===1&&!w.img)return alert('Import an image first.');if(w.step===2){w.distFt=parseFloat($('distFt')?.value||w.distFt);if(!w.a||!w.b||!w.distFt)return alert('Set A, B and distance.')}if(w.step===3&&!w.anchor)return alert('Set anchor.');if(w.step<4){w.step++;renderWizard();return}saveWizard()}
function saveWizard(){const s=cur(),w=state.wiz;if(!s)return;const distM=w.distFt*0.3048;const ppm=Math.hypot(w.b.x-w.a.x,w.b.y-w.a.y)/distM;const first=s.photos[0];s.floorPlan={imageData:w.imgSrc,pixelsPerMetre:ppm,calibrationDistanceFt:w.distFt,anchorPixelX:w.anchor.x,anchorPixelY:w.anchor.y,anchorLocalX:first?.localX||0,anchorLocalY:first?.localY||0,northDeg:w.northDeg};s.photos.forEach(p=>applyPlanToPhoto(s,p));save();$('wizard').classList.remove('show');renderAll();fitView()}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJson(){const s=cur();if(s)download(`${s.name.replace(/\W+/g,'_')}.json`,JSON.stringify(s,null,2),'application/json')}function exportCsv(){const s=cur();if(!s)return;const cols=['sequenceNumber','timestamp','localX','localY','planPixelX','planPixelY','heading','positionSource','cameraZoom','groupId','isPrimary'];const rows=[cols.join(',')].concat(s.photos.map(p=>cols.map(c=>JSON.stringify(p[c]??'')).join(',')));download(`${s.name.replace(/\W+/g,'_')}.csv`,rows.join('\n'),'text/csv')}
Array.from(document.querySelectorAll('.tabBtn')).forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabBody').forEach(x=>x.classList.remove('show'));$(b.dataset.tab).classList.add('show')});
$('newSession').onclick=newSession;$('startStop').onclick=toggleStart;$('deleteSession').onclick=deleteSession;$('cameraBtn').onclick=openCamera;$('closeCam').onclick=closeCamera;$('shutter').onclick=capture;$('resetView').onclick=fitView;$('planSetup').onclick=openWizard;$('wizClose').onclick=()=>$('wizard').classList.remove('show');$('wizBack').onclick=()=>{if(state.wiz.step>1){state.wiz.step--;renderWizard()}};$('wizNext').onclick=wizNext;$('downloadJson').onclick=exportJson;$('downloadCsv').onclick=exportCsv;$('menuBtn').onclick=()=>$('side').classList.toggle('open');$('photoPreview').onclick=closePhotoPreview;$('vIn').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.4)};$('vOut').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.4)};$('vFit').onclick=fitView;$('vCtr').onclick=()=>{const s=cur();if(!s)return;const last=(s.photos||[]).filter(p=>p.localX!=null||p.planPixelX!=null).slice(-1)[0];if(!last){fitView();return}const r=canvas.getBoundingClientRect();let q;if(s.floorPlan)q=last.planPixelX!=null?{x:last.planPixelX,y:last.planPixelY}:localToPlan(s.floorPlan,last.localX,last.localY);else q=metricToScreen(last.localX,last.localY);const t=state.ui.transform;t.x=r.width/2-q.x*t.scale;t.y=r.height/2-q.y*t.scale;draw()};
load(); resize(); renderAll(); fitView(); setInterval(()=>{renderHud();draw()},1000);
