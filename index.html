<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>SitePhoto Field Documentation</title>
<style>
:root{
  --navy:#0d1b2a;--navy2:#162032;--navy3:#1e2f42;--steel:#2c4159;--teal:#1a6b5c;--teal2:#22896f;--amber:#d4820a;--amber2:#f0a020;--red:#c0392b;--dim:#8fa3b8;--text:#e8eef5;--line:#334a63;--blue:#2b7fff;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
}
*{box-sizing:border-box} html,body{height:100%;margin:0;background:var(--navy);color:var(--text);font-family:var(--sans)}
body{min-height:100dvh;overflow:hidden}.app{height:100dvh;display:flex;flex-direction:column}.topbar{height:54px;display:flex;align-items:center;gap:10px;padding:8px 10px;border-bottom:1px solid var(--steel);background:var(--navy2);font-family:var(--mono)}
.brand{font-weight:700;letter-spacing:.04em}.spacer{flex:1}.badge{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--steel);background:var(--navy3);color:var(--text);font:12px var(--mono);padding:3px 7px}.badge.rec{background:var(--red);border-color:var(--red)}.badge.gps,.badge.dr{background:var(--teal);border-color:var(--teal2)}.badge.man{background:var(--amber);border-color:var(--amber2);color:#111}.badge.warn{background:transparent;border-color:var(--amber);color:var(--amber2)}
button,input,select{font-family:var(--mono)}button{border:1px solid var(--steel);background:var(--navy3);color:var(--text);padding:9px 10px;border-radius:0;font-size:13px}button.primary{background:var(--teal);border-color:var(--teal2)}button.danger{background:var(--red);border-color:var(--red)}button:disabled{opacity:.45}.content{flex:1;display:grid;grid-template-columns:340px 1fr;min-height:0}.side{border-right:1px solid var(--steel);background:var(--navy2);overflow:auto}.main{position:relative;min-width:0;min-height:0;background:#07111d}.panel{padding:12px;border-bottom:1px solid var(--steel)}h2,h3{font-family:var(--mono);font-size:14px;margin:0 0 10px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field label{font:11px var(--mono);color:var(--dim);text-transform:uppercase}.field input{background:var(--navy);border:1px solid var(--steel);color:var(--text);padding:9px}.session{border:1px solid var(--steel);padding:9px;margin:8px 0;background:var(--navy3);cursor:pointer}.session.active{outline:2px solid var(--teal2)}.session .title{font:13px var(--mono);font-weight:700}.session .meta{font:11px var(--mono);color:var(--dim);margin-top:5px}.tabs{display:flex}.tabs button{flex:1;border-left:0;border-right:1px solid var(--steel)}.tabBody{display:none}.tabBody.show{display:block}.metric{font:12px var(--mono);color:var(--dim)}.hud{position:absolute;left:10px;top:10px;z-index:5;display:grid;grid-template-columns:repeat(2,minmax(92px,auto));gap:6px;pointer-events:none}.hud .box{background:rgba(13,27,42,.85);border:1px solid var(--steel);padding:6px 7px;font:12px var(--mono)}.hud b{color:var(--text)}#planCanvas{width:100%;height:100%;display:block;touch-action:none}.cameraOverlay{position:absolute;inset:0;background:#000;z-index:20;display:none;flex-direction:column}.cameraOverlay.show{display:flex}video{width:100%;height:100%;object-fit:cover}.cameraHud{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-wrap:wrap;gap:6px;z-index:25}.cameraControls{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:16px;z-index:25}.shutter{width:76px;height:76px;border-radius:50%;border:4px solid #fff;background:#eee;color:#111}.flash{animation:flash .18s}@keyframes flash{from{filter:brightness(3)}to{filter:brightness(1)}}.photoItem{border-bottom:1px solid var(--steel);padding:9px}.photoItem .n{font:13px var(--mono);font-weight:700}.thumb{width:72px;height:54px;object-fit:cover;border:1px solid var(--steel);float:right;margin-left:8px}.modal{position:absolute;inset:0;z-index:30;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;padding:12px}.modal.show{display:flex}.card{width:min(720px,100%);max-height:90dvh;overflow:auto;background:var(--navy2);border:1px solid var(--steel);padding:14px}.wizardCanvas{width:100%;height:430px;border:1px solid var(--steel);background:#111;touch-action:none}.notice{background:var(--navy3);border:1px solid var(--steel);padding:10px;margin:8px 0;font:12px var(--mono);color:var(--dim)}.corr{position:absolute;left:10px;right:10px;bottom:10px;z-index:10;background:rgba(22,32,50,.95);border:1px solid var(--amber);padding:10px;display:none}.corr.show{display:block}.detail{position:absolute;right:10px;top:10px;z-index:6;background:rgba(22,32,50,.96);border:1px solid var(--steel);padding:10px;min-width:220px;font:12px var(--mono);display:none}.detail.show{display:block}.planCtl{position:absolute;right:10px;top:90px;z-index:6;display:flex;flex-direction:column;gap:6px}.planCtl button{width:46px;height:46px;padding:0;font:13px var(--mono);background:rgba(22,32,50,.92);color:var(--text);border:1px solid var(--steel)}.zoomBar{position:absolute;left:0;right:0;bottom:calc(110px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:25;pointer-events:none}.zoomBar button{pointer-events:auto;width:48px;height:36px;border-radius:18px;background:rgba(0,0,0,.55);color:#fff;border:1px solid #777;font:12px var(--mono)}.zoomBar button.active{background:#fff;color:#111;border-color:#fff}@media(max-width:820px){.content{grid-template-columns:1fr}.side{position:absolute;left:0;top:54px;bottom:0;width:88vw;max-width:360px;z-index:15;transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.mobileOnly{display:inline-flex!important}}.mobileOnly{display:none}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"><button id="menuBtn" class="mobileOnly">☰</button><div class="brand">SITEPHOTO</div><span id="recBadge" class="badge">IDLE</span><span id="sensorBadge" class="badge warn">SENSORS OFF</span><div class="spacer"></div><button id="permitBtn">Enable Sensors</button><button id="cameraBtn" class="primary">Camera</button></div>
  <div class="content">
    <aside class="side" id="side">
      <div class="panel"><h2>Sessions</h2><div class="field"><label>Project Name</label><input id="sessionName" placeholder="required" /></div><div class="row"><button id="newSession" class="primary">New</button><button id="startStop">Start</button><button id="deleteSession">Delete</button></div><div id="sessions"></div></div>
      <div class="tabs"><button data-tab="photos" class="tabBtn">Photos</button><button data-tab="plan" class="tabBtn">Plan</button><button data-tab="export" class="tabBtn">Export</button></div>
      <div id="photos" class="tabBody show"><div class="panel"><h3>Photo Index</h3><div id="photoList" class="metric">No photos.</div></div></div>
      <div id="plan" class="tabBody"><div class="panel"><h3>Floor Plan</h3><div class="row"><button id="planSetup">Setup</button><button id="correctBtn">Correct Position</button><button id="resetView">Fit View</button></div><div id="planStatus" class="notice">No floor plan calibrated. Metric grid mode active.</div></div></div>
      <div id="export" class="tabBody"><div class="panel"><h3>Session Export</h3><button id="downloadJson">Download JSON</button><button id="downloadCsv">Download CSV</button><div class="notice">PDF export is intentionally left as the next module. This web MVP exports litigation-support data as JSON/CSV.</div></div></div>
    </aside>
    <main class="main"><canvas id="planCanvas"></canvas><div class="hud" id="hud"></div><div class="detail" id="detail"></div><div class="planCtl"><button id="vFit" title="Fit View">FIT</button><button id="vIn" title="Zoom In">+</button><button id="vOut" title="Zoom Out">-</button><button id="vCtr" title="Center on Last Photo">CTR</button></div><div class="corr" id="corr"></div></main>
  </div>
</div>
<div class="cameraOverlay" id="cam"><video id="video" playsinline autoplay muted></video><div class="cameraHud" id="cameraHud"></div><div class="zoomBar" id="zoomBar"></div><div class="cameraControls"><button id="closeCam">Close</button><button id="shutter" class="shutter">●</button></div></div>
<div class="modal" id="wizard"><div class="card"><h2>Floor Plan Setup</h2><div id="wizBody"></div><div class="row" style="margin-top:10px"><button id="wizBack">Back</button><button id="wizNext" class="primary">Next</button><button id="wizClose">Close</button></div></div></div>
<canvas id="captureCanvas" style="display:none"></canvas>
<script>
'use strict';
const $=id=>document.getElementById(id); const DPR=()=>window.devicePixelRatio||1; const rad=d=>d*Math.PI/180; const deg=r=>(r*180/Math.PI+360)%360;
const COLORS={navy:'#0d1b2a',navy2:'#162032',navy3:'#1e2f42',steel:'#2c4159',teal:'#1a6b5c',amber:'#d4820a',red:'#c0392b',dim:'#8fa3b8',text:'#e8eef5',blue:'#2b7fff'};
let state={sessions:[],currentId:null,sensor:{heading:0,pitch:0,roll:0,lat:null,lon:null,alt:null,acc:null,origin:null,localX:0,localY:0,steps:0,dist:0,source:'deadReckoning'},ui:{transform:{x:0,y:0,scale:1},selected:null,tab:'photos'},camera:{zoom:1,deviceId:null,devices:[],lenses:[],digitalFactor:1,activeLens:null},pendingPhoto:null,cameraStream:null,planImg:null,wiz:{step:1,img:null,imgSrc:null,a:null,b:null,distM:null,anchor:null,northDeg:180},corr:null};
function uid(){return Math.random().toString(36).slice(2)+Date.now().toString(36)}
function nowName(){return new Date().toLocaleString()} function cur(){return state.sessions.find(s=>s.id===state.currentId)||null}
function save(){localStorage.setItem('sitephoto.v1',JSON.stringify({sessions:state.sessions,currentId:state.currentId}))}
function load(){try{const x=JSON.parse(localStorage.getItem('sitephoto.v1')||'{}');state.sessions=x.sessions||[];state.currentId=x.currentId||state.sessions[0]?.id||null}catch(e){}}
function newSession(){const name=$('sessionName').value.trim();if(!name)return alert('Enter a project name first.');const s={id:uid(),name,projectName:name,created:new Date().toISOString(),started:false,stopped:false,photos:[],floorPlan:null,path:[],projectGps:null};state.sessions.unshift(s);state.currentId=s.id;$('sessionName').value='';save();renderAll();fitView()}
function toggleStart(){const s=cur();if(!s)return;if(s.stopped)return;if(!s.started){s.started=true;s.startedAt=new Date().toISOString();const sn=state.sensor;if(sn.lat!=null)s.projectGps={lat:sn.lat,lon:sn.lon,altitude:sn.alt,accuracy:sn.acc,timestamp:s.startedAt};else if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{s.projectGps={lat:p.coords.latitude,lon:p.coords.longitude,altitude:p.coords.altitude,accuracy:p.coords.accuracy,timestamp:new Date().toISOString()};save();renderAll()},e=>console.warn('start GPS failed',e),{enableHighAccuracy:true,timeout:8000})}else{s.started=false;s.stopped=true;s.stoppedAt=new Date().toISOString()}save();renderAll()}
function deleteSession(){const s=cur();if(!s)return;if(!confirm('Delete current session?'))return;state.sessions=state.sessions.filter(x=>x.id!==s.id);state.currentId=state.sessions[0]?.id||null;save();renderAll();fitView()}
function localFromGps(lat,lon){const o=state.sensor.origin;if(!o)return null;const R=6378137, lat0=rad(o.lat);return {x:rad(lon-o.lon)*R*Math.cos(lat0), y:rad(lat-o.lat)*R}}
async function enableSensors(){
  if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){try{const r=await DeviceOrientationEvent.requestPermission(); if(r!=='granted')return alert('Orientation permission denied.')}catch(e){alert(e.message)}}
  if(window.DeviceMotionEvent&&typeof DeviceMotionEvent.requestPermission==='function'){try{await DeviceMotionEvent.requestPermission()}catch(e){}}
  window.addEventListener('deviceorientation',onOrient,true);
  if(navigator.geolocation){navigator.geolocation.watchPosition(onGps,e=>console.warn(e),{enableHighAccuracy:true,maximumAge:500,timeout:10000})}
  $('sensorBadge').textContent='SENSORS ON'; $('sensorBadge').className='badge gps';
}
function onGps(p){const c=p.coords;state.sensor.lat=c.latitude;state.sensor.lon=c.longitude;state.sensor.alt=c.altitude;state.sensor.acc=c.accuracy;if(!state.sensor.origin&&c.accuracy<=20){state.sensor.origin={lat:c.latitude,lon:c.longitude};state.sensor.localX=0;state.sensor.localY=0;state.sensor.source='gps'} const g=localFromGps(c.latitude,c.longitude); if(g && c.accuracy<=8 && state.sensor.steps<2){state.sensor.localX=g.x;state.sensor.localY=g.y;state.sensor.source='gps'} renderHud(); draw()}
function onOrient(e){let h;if(typeof e.webkitCompassHeading==='number')h=e.webkitCompassHeading;else if(typeof e.alpha==='number')h=(360-e.alpha)%360;if(typeof h==='number')state.sensor.heading=h;state.sensor.pitch=e.beta||0;state.sensor.roll=e.gamma||0;renderHud();draw()}
function snapshot(){const s=state.sensor;return {timestamp:new Date().toISOString(),latitude:s.lat,longitude:s.lon,altitude:s.alt,gpsAccuracy:s.acc,localX:s.localX,localY:s.localY,heading:s.heading,pitch:s.pitch,roll:s.roll,positionSource:s.source,steps:s.steps,distance:s.dist}}
async function openCamera(){try{if(!cur()||!cur().started||cur().stopped)return alert('Start an active session first.');state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=state.cameraStream;$('cam').classList.add('show');try{const all=await navigator.mediaDevices.enumerateDevices();state.camera.devices=all.filter(d=>d.kind==='videoinput')}catch(e){state.camera.devices=[]}state.camera.lenses=classifyLenses(state.camera.devices);state.camera.zoom=1;state.camera.digitalFactor=1;state.camera.deviceId=state.cameraStream.getVideoTracks()[0]?.getSettings?.().deviceId||null;const initial=state.camera.lenses.find(l=>l.deviceId===state.camera.deviceId);state.camera.activeLens=initial?.kind||(state.camera.lenses.find(l=>l.kind==='wide')?.kind||null);if(state.camera.lenses.length&&!initial){const wide=state.camera.lenses.find(l=>l.kind==='wide')||state.camera.lenses[0];try{state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:wide.deviceId}}});$('video').srcObject=state.cameraStream;state.camera.deviceId=wide.deviceId;state.camera.activeLens=wide.kind}catch(e){console.warn('initial wide select failed',e)}}$('video').style.transform='';renderZoomBar()}catch(e){alert('Camera failed: '+e.message)}}
function classifyLenses(devices){const back=devices.filter(d=>/back|rear/i.test(d.label||''));const list=back.length?back:devices.filter(d=>!/front|user/i.test(d.label||''));return list.map(d=>{const l=(d.label||'').toLowerCase();let base=1,kind='wide';if(/ultra/.test(l)){base=0.5;kind='ultrawide'}else if(/tele/.test(l)){base=5;kind='telephoto'}return{deviceId:d.deviceId,label:d.label||'(unlabeled)',base,kind}})}
function renderZoomBar(){const z=state.camera.zoom;$('zoomBar').innerHTML=[0.5,1,2,4,8].map(v=>`<button data-z="${v}" class="${Math.abs(v-z)<0.01?'active':''}">${v}x</button>`).join('');Array.from($('zoomBar').children).forEach(b=>b.onclick=()=>applyCameraZoom(parseFloat(b.dataset.z)))}
async function applyCameraZoom(z){const v=$('video');const lenses=state.camera.lenses||[];if(!lenses.length){alert('No back cameras detected. Close and reopen the camera.');return}let lens=null;const sorted=[...lenses].sort((a,b)=>a.base-b.base);for(const l of sorted)if(l.base<=z+0.001)lens=l;if(!lens)lens=sorted[0];if(z<1){const ultra=lenses.find(l=>l.kind==='ultrawide');if(ultra)lens=ultra;else{alert('Ultrawide lens not available. The 0.5x zoom needs an ultrawide camera.');return}}const digital=z/lens.base;if(lens.deviceId!==state.camera.deviceId){try{if(state.cameraStream)state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{deviceId:{exact:lens.deviceId}}});v.srcObject=state.cameraStream;state.camera.deviceId=lens.deviceId;state.camera.activeLens=lens.kind}catch(e){console.warn('lens switch failed',e);alert('Lens switch failed: '+e.message);return}}else{state.camera.activeLens=lens.kind}const track=state.cameraStream?.getVideoTracks?.()[0];let usedNative=false;if(digital>1.001&&track){const caps=track.getCapabilities?.()||{};if(caps.zoom&&digital>=caps.zoom.min&&digital<=caps.zoom.max){try{await track.applyConstraints({advanced:[{zoom:digital}]});usedNative=true}catch(e){console.warn('native zoom failed',e)}}}else if(track){const caps=track.getCapabilities?.()||{};if(caps.zoom){try{await track.applyConstraints({advanced:[{zoom:caps.zoom.min||1}]})}catch(e){}}}v.style.transform=(!usedNative&&digital>1.001)?`scale(${digital})`:'';v.style.transformOrigin='center center';state.camera.zoom=z;state.camera.digitalFactor=usedNative?1:digital;renderZoomBar()}
function closeCamera(){if(state.cameraStream){state.cameraStream.getTracks().forEach(t=>t.stop());state.cameraStream=null}$('cam').classList.remove('show')}
function capture(){const s=cur();if(!s||!s.started||s.stopped)return alert('Start an active session first.');const v=$('video'),c=$('captureCanvas'),w=v.videoWidth,h=v.videoHeight;if(!w)return;const z=Math.max(1,state.camera.digitalFactor||1);const sw=w/z,sh=h/z,sx=(w-sw)/2,sy=(h-sh)/2;c.width=Math.min(1280,Math.round(sw));c.height=Math.round(c.width*sh/sw);const ctx=c.getContext('2d');ctx.drawImage(v,sx,sy,sw,sh,0,0,c.width,c.height);const data=c.toDataURL('image/jpeg',.55);$('cam').classList.add('flash');setTimeout(()=>$('cam').classList.remove('flash'),180);closeCamera();const sn=state.sensor;state.pendingPhoto={id:uid(),sequenceNumber:s.photos.length+1,timestamp:new Date().toISOString(),imageData:data,thumbnail:data,location:null,heading:null,cameraZoom:state.camera.zoom||1,sensorAt:{heading:sn.heading,pitch:sn.pitch,roll:sn.roll,lat:sn.lat,lon:sn.lon,alt:sn.alt,acc:sn.acc},step:'location'};showPhotoLocate()}
function showPhotoLocate(){state.corr={point:null,heading:0,drag:false,pending:true};renderLocateBar();$('corr').classList.add('show');draw()}
function renderLocateBar(){const p=state.pendingPhoto;if(!p){$('corr').classList.remove('show');return}const bar=$('corr');if(p.step==='location'){bar.innerHTML=`<b>PHOTO #${p.sequenceNumber} · LOCATION</b><div class="metric">Tap on the plan where this photo was taken.</div><div class="row"><button id="locSkip">Skip Location</button><button id="locDiscard" class="danger">Discard Photo</button></div>`;$('locSkip').onclick=()=>{p.location=null;p.heading=null;commitPendingPhoto()};$('locDiscard').onclick=discardPendingPhoto}else{bar.innerHTML=`<b>PHOTO #${p.sequenceNumber} · DIRECTION</b><div class="metric">Drag from the pin in the direction the camera was facing. Tap a new spot to move the pin.</div><div class="row"><button id="locBack">Back</button><button id="locSkipDir">Skip Direction</button><button id="locSave" class="primary">Save Photo</button></div>`;$('locBack').onclick=()=>{p.location=null;p.heading=null;state.corr={point:null,heading:0,drag:false,pending:true};p.step='location';renderLocateBar();draw()};$('locSkipDir').onclick=()=>{p.heading=null;commitPendingPhoto()};$('locSave').onclick=commitPendingPhoto}}
function discardPendingPhoto(){if(!confirm('Discard this photo?'))return;state.pendingPhoto=null;state.corr=null;$('corr').classList.remove('show');draw()}
function commitPendingPhoto(){const s=cur(),pp=state.pendingPhoto;if(!s||!pp)return;let localX=null,localY=null,planPixelX=null,planPixelY=null,heading=pp.heading,positionSource='none';if(pp.location){if(s.floorPlan){const loc=planToLocal(s.floorPlan,pp.location.x,pp.location.y);localX=loc.x;localY=loc.y;planPixelX=pp.location.x;planPixelY=pp.location.y}else{const m=screenToMetric(pp.location.x,pp.location.y);localX=m.x;localY=m.y}positionSource='manual'}const sa=pp.sensorAt||{};const photo={id:pp.id,sequenceNumber:pp.sequenceNumber,timestamp:pp.timestamp,latitude:sa.lat??null,longitude:sa.lon??null,altitude:sa.alt??null,gpsAccuracy:sa.acc??null,localX,localY,heading,pitch:sa.pitch??null,roll:sa.roll??null,positionSource,cameraZoom:pp.cameraZoom??1,imageData:pp.imageData,thumbnail:pp.thumbnail,planPixelX,planPixelY};s.photos.push(photo);if(pp.location)s.path.push({x:localX,y:localY,t:photo.timestamp,manual:true});state.pendingPhoto=null;state.corr=null;$('corr').classList.remove('show');save();renderAll();draw()}
function applyPlanToPhoto(s,p){if(!s.floorPlan)return;const q=localToPlan(s.floorPlan,p.localX,p.localY);p.planPixelX=q.x;p.planPixelY=q.y}
function localToPlan(fp,localX,localY){const dx=localX-fp.anchorLocalX,dy=localY-fp.anchorLocalY,th=rad(fp.northDeg);const imgDX=dx*Math.cos(th)+dy*Math.sin(th);const imgDY=-(-dx*Math.sin(th)+dy*Math.cos(th));return{x:fp.anchorPixelX+imgDX*fp.pixelsPerMetre,y:fp.anchorPixelY+imgDY*fp.pixelsPerMetre}}
function planToLocal(fp,px,py){const imgDX=px-fp.anchorPixelX,imgDY=-(py-fp.anchorPixelY),th=rad(fp.northDeg);const dX=imgDX*Math.cos(th)-imgDY*Math.sin(th);const dY=imgDX*Math.sin(th)+imgDY*Math.cos(th);return{x:fp.anchorLocalX+dX/fp.pixelsPerMetre,y:fp.anchorLocalY+dY/fp.pixelsPerMetre}}
function renderAll(){renderSessions();renderPhotos();renderHud();renderPlanStatus();const s=cur();$('recBadge').textContent=s?.started&&!s?.stopped?'REC':'IDLE';$('recBadge').className=s?.started&&!s?.stopped?'badge rec':'badge';$('startStop').textContent=s?.started&&!s?.stopped?'Stop':'Start';loadPlanImage().then(draw)}
function renderSessions(){const el=$('sessions');el.innerHTML='';state.sessions.forEach(s=>{const d=document.createElement('div');d.className='session '+(s.id===state.currentId?'active':'');const gps=s.projectGps?`GPS ${s.projectGps.lat.toFixed(5)}, ${s.projectGps.lon.toFixed(5)} ±${fmt(s.projectGps.accuracy)}m`:s.started?'GPS pending…':'GPS not yet recorded';d.innerHTML=`<div class="title">${esc(s.projectName||s.name)} ${s.started&&!s.stopped?'<span class="badge rec">REC</span>':''}</div><div class="meta">${s.photos.length} photos · ${s.floorPlan?'plan calibrated':'metric grid'}<br>${new Date(s.created).toLocaleString()}<br>${gps}</div>`;d.onclick=()=>{state.currentId=s.id;save();renderAll();fitView();if(innerWidth<820)$('side').classList.remove('open')};el.appendChild(d)})}
function renderPhotos(){const s=cur(),el=$('photoList');if(!s||!s.photos.length){el.textContent='No photos.';return}el.innerHTML=s.photos.map(p=>{const src=p.positionSource||'none';const cls=src==='manual'?'man':src==='gps'?'gps':src==='none'?'warn':'dr';const lbl=src==='manual'?'MAN':src==='gps'?'GPS':src==='none'?'NO LOC':'DR';const loc=src==='none'?'(no location)':'X '+fmt(p.localX)+'m · Y '+fmt(p.localY)+'m';return `<div class="photoItem"><img class="thumb" src="${p.thumbnail}"><div class="n">#${p.sequenceNumber} <span class="badge ${cls}">${lbl}</span></div><div>${new Date(p.timestamp).toLocaleString()}</div><div>${loc}</div><div>H ${fmt(p.heading)}° · ${fmt(p.cameraZoom||1)}x</div></div>`}).join('')}
function renderHud(){const s=state.sensor;const html=[['HDG',fmt(s.heading)+'°'],['P/R',fmt(s.pitch)+' / '+fmt(s.roll)+'°'],['ALT',s.alt==null?'—':fmt(s.alt)+' m'],['GPS',s.acc==null?'—':'±'+fmt(s.acc)+' m']].map(a=>`<div class="box">${a[0]} <b>${a[1]}</b></div>`).join('');$('hud').innerHTML=html;const cam=state.camera,lensTxt=cam.activeLens?`<div class="badge">LENS <b>${cam.activeLens.toUpperCase()}${cam.digitalFactor>1.001?' · DIG '+fmt(cam.digitalFactor)+'x':''}</b></div>`:'';$('cameraHud').innerHTML=html.replaceAll('box','badge')+lensTxt}
function renderPlanStatus(){const s=cur(),fp=s?.floorPlan;$('planStatus').textContent=fp?`Calibrated: ${fmt(fp.pixelsPerMetre)} px/m · northDeg ${fmt(fp.northDeg)} · anchor ${fmt(fp.anchorPixelX)}, ${fmt(fp.anchorPixelY)}`:'No floor plan calibrated. Metric grid mode active.'}
function esc(x){return String(x||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))} function fmt(x){return x==null||Number.isNaN(x)?'—':Number(x).toFixed(1)}
const canvas=$('planCanvas'),ctx=canvas.getContext('2d');function resize(){const r=canvas.getBoundingClientRect(),d=DPR();canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);draw()}window.addEventListener('resize',resize);
async function loadPlanImage(){const s=cur();if(!s?.floorPlan?.imageData){state.planImg=null;return} if(state.planImg?.src===s.floorPlan.imageData)return;state.planImg=new Image();state.planImg.src=s.floorPlan.imageData;await state.planImg.decode().catch(()=>{})}
function draw(){const r=canvas.getBoundingClientRect(),d=DPR(),t=state.ui.transform;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);ctx.fillStyle='#07111d';ctx.fillRect(0,0,r.width,r.height);ctx.save();ctx.translate(t.x,t.y);ctx.scale(t.scale,t.scale);const s=cur(); if(s?.floorPlan&&state.planImg){ctx.drawImage(state.planImg,0,0);drawPlanOverlays(s)}else drawMetric(s,r);ctx.restore();drawNorth(r);drawScaleBar(r);drawSelected()}
function drawMetric(s,r){drawGrid(-2000,-2000,4000,4000,40/state.ui.transform.scale);const pts=(s?.photos||[]).filter(p=>p.localX!=null).map(p=>({x:p.localX,y:p.localY,p}));drawPathMetric(s?.path||[]);pts.forEach(o=>drawMarker(metricToScreen(o.x,o.y),o.p.heading||0,o.p.sequenceNumber,o.p.positionSource))}
function metricToScreen(x,y){return{x:x*40,y:-y*40}}function screenToMetric(x,y){return{x:x/40,y:-y/40}}
function drawGrid(x,y,w,h,step){step=Math.max(5,step);ctx.strokeStyle='rgba(143,163,184,.22)';ctx.lineWidth=1/state.ui.transform.scale;ctx.beginPath();for(let i=-2000;i<=2000;i+=step){ctx.moveTo(i,-2000);ctx.lineTo(i,2000);ctx.moveTo(-2000,i);ctx.lineTo(2000,i)}ctx.stroke();ctx.strokeStyle='rgba(232,238,245,.5)';ctx.beginPath();ctx.moveTo(-2000,0);ctx.lineTo(2000,0);ctx.moveTo(0,-2000);ctx.lineTo(0,2000);ctx.stroke()}
function drawPathMetric(path){if(path.length<2)return;ctx.strokeStyle=COLORS.dim;ctx.setLineDash([8,6]);ctx.lineWidth=2/state.ui.transform.scale;ctx.beginPath();path.forEach((p,i)=>{const q=metricToScreen(p.x,p.y);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();ctx.setLineDash([])}
function drawLiveMetric(){const q=metricToScreen(state.sensor.localX,state.sensor.localY);drawLive(q,state.sensor.heading)}
function drawPlanOverlays(s){if(s.path.length>1){ctx.strokeStyle=COLORS.dim;ctx.setLineDash([8,6]);ctx.lineWidth=2/state.ui.transform.scale;ctx.beginPath();s.path.forEach((p,i)=>{const q=localToPlan(s.floorPlan,p.x,p.y);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.stroke();ctx.setLineDash([])}s.photos.forEach(p=>{if(p.localX==null&&p.planPixelX==null)return;const q=p.planPixelX==null?localToPlan(s.floorPlan,p.localX,p.localY):{x:p.planPixelX,y:p.planPixelY};drawMarker(q,(p.heading||0)-s.floorPlan.northDeg,p.sequenceNumber,p.positionSource)})}
function drawMarker(q,bearing,n,source){ctx.save();ctx.translate(q.x,q.y);const color=source==='manual'?COLORS.amber:COLORS.teal;ctx.strokeStyle=color;ctx.fillStyle=color;ctx.lineWidth=2/state.ui.transform.scale;const a=rad(bearing-90);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*32,Math.sin(a)*32);ctx.stroke();ctx.beginPath();ctx.moveTo(Math.cos(a)*38,Math.sin(a)*38);ctx.lineTo(Math.cos(a+.45)*26,Math.sin(a+.45)*26);ctx.lineTo(Math.cos(a-.45)*26,Math.sin(a-.45)*26);ctx.closePath();ctx.fill();ctx.beginPath();ctx.arc(0,0,13,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.font=`${12/state.ui.transform.scale}px ${getComputedStyle(document.body).fontFamily}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.setTransform(DPR(),0,0,DPR(),0,0);const screen=worldToCanvas(q.x,q.y);ctx.fillText(n,screen.x,screen.y);ctx.restore()}
function drawLive(q,bearing){ctx.save();ctx.translate(q.x,q.y);ctx.fillStyle=COLORS.blue;ctx.globalAlpha=.25;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,45,rad(bearing-102.5),rad(bearing-77.5));ctx.closePath();ctx.fill();ctx.globalAlpha=1;ctx.beginPath();ctx.arc(0,0,7,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawNorth(r){ctx.save();ctx.translate(r.width-44,44);ctx.fillStyle=COLORS.text;ctx.strokeStyle=COLORS.text;ctx.font='12px monospace';ctx.textAlign='center';ctx.beginPath();ctx.moveTo(0,-24);ctx.lineTo(8,6);ctx.lineTo(0,2);ctx.lineTo(-8,6);ctx.closePath();ctx.fill();ctx.fillText('N',0,22);ctx.restore()}
function drawScaleBar(r){ctx.save();ctx.translate(18,r.height-28);ctx.strokeStyle=COLORS.text;ctx.fillStyle=COLORS.text;ctx.font='12px monospace';let m= nice(120/(40*state.ui.transform.scale));let px=m*40*state.ui.transform.scale;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(px,0);ctx.moveTo(0,-5);ctx.lineTo(0,5);ctx.moveTo(px,-5);ctx.lineTo(px,5);ctx.stroke();ctx.fillText(m+' m',0,-9);ctx.restore()}function nice(x){const a=[1,2,5,10,20,50,100];return a.find(v=>v>=x)||200}
function worldToCanvas(x,y){const t=state.ui.transform;return{x:t.x+x*t.scale,y:t.y+y*t.scale}}function canvasToWorld(cx,cy){const t=state.ui.transform;return{x:(cx-t.x)/t.scale,y:(cy-t.y)/t.scale}}
function drawSelected(){const p=state.ui.selected;const d=$('detail');if(!p){d.classList.remove('show');return}d.classList.add('show');const src=p.positionSource||'none';const cls=src==='manual'?'man':src==='gps'?'gps':src==='none'?'warn':'dr';d.innerHTML=`<b>PHOTO #${p.sequenceNumber}</b><br>${new Date(p.timestamp).toLocaleString()}<br><span class="badge ${cls}">${src.toUpperCase()}</span><br>H ${fmt(p.heading)}° P ${fmt(p.pitch)}° R ${fmt(p.roll)}°<br>${src==='none'?'no location':'X '+fmt(p.localX)+'m Y '+fmt(p.localY)+'m'}<br>ALT ${fmt(p.altitude)}m · ${fmt(p.cameraZoom||1)}x`}
let touch=null;canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId); if(state.corr){handleCorrectionDown(e);return} touch={id:e.pointerId,x:e.clientX,y:e.clientY,tx:state.ui.transform.x,ty:state.ui.transform.y,drag:false}});canvas.addEventListener('pointermove',e=>{if(state.corr){handleCorrectionMove(e);return} if(!touch||touch.id!==e.pointerId)return;state.ui.transform.x=touch.tx+(e.clientX-touch.x);state.ui.transform.y=touch.ty+(e.clientY-touch.y);touch.drag=true;draw()});canvas.addEventListener('pointerup',e=>{if(state.corr){handleCorrectionUp(e);return} if(touch&&!touch.drag)selectAt(e);touch=null});canvas.addEventListener('wheel',e=>{e.preventDefault();const ratio=e.deltaY<0?1.1:.9;zoomAt(e.clientX,e.clientY,ratio)},{passive:false});
let lastPinch=null;canvas.addEventListener('touchmove',e=>{if(e.touches.length===2&&!state.corr){e.preventDefault();const a=e.touches[0],b=e.touches[1],dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),mid={x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2};if(lastPinch)zoomAt(mid.x,mid.y,dist/lastPinch);lastPinch=dist}},{passive:false});canvas.addEventListener('touchend',()=>lastPinch=null);
function zoomAt(cx,cy,ratio){const rect=canvas.getBoundingClientRect();cx-=rect.left;cy-=rect.top;const t=state.ui.transform;ratio=Math.max(.2,Math.min(5,ratio));const ns=Math.min(Math.max(t.scale*ratio,.1),20);ratio=ns/t.scale;t.x=cx+(t.x-cx)*ratio;t.y=cy+(t.y-cy)*ratio;t.scale=ns;draw()}
function selectAt(e){const rect=canvas.getBoundingClientRect(),w=canvasToWorld(e.clientX-rect.left,e.clientY-rect.top),s=cur();let best=null,bd=20/state.ui.transform.scale;(s?.photos||[]).forEach(p=>{if(p.localX==null&&p.planPixelX==null)return;let q=s.floorPlan?(p.planPixelX!=null?{x:p.planPixelX,y:p.planPixelY}:localToPlan(s.floorPlan,p.localX,p.localY)):metricToScreen(p.localX,p.localY);let d=Math.hypot(q.x-w.x,q.y-w.y);if(d<bd){bd=d;best=p}});state.ui.selected=best;draw()}
function fitView(){const r=canvas.getBoundingClientRect(),s=cur();let pts=[];if(s?.floorPlan&&state.planImg){pts=[{x:0,y:0},{x:state.planImg.width,y:state.planImg.height}]}else{pts=(s?.photos||[]).map(p=>metricToScreen(p.localX,p.localY));pts.push(metricToScreen(state.sensor.localX,state.sensor.localY))}if(!pts.length){state.ui.transform={x:r.width/2,y:r.height/2,scale:1};draw();return}const minX=Math.min(...pts.map(p=>p.x)),maxX=Math.max(...pts.map(p=>p.x)),minY=Math.min(...pts.map(p=>p.y)),maxY=Math.max(...pts.map(p=>p.y));const scale=Math.min((r.width-80)/Math.max(1,maxX-minX),(r.height-80)/Math.max(1,maxY-minY));state.ui.transform={scale:Math.min(Math.max(scale,.1),4),x:r.width/2-(minX+maxX)/2*Math.min(Math.max(scale,.1),4),y:r.height/2-(minY+maxY)/2*Math.min(Math.max(scale,.1),4)};draw()}
function startCorrection(){if(state.pendingPhoto)return;state.corr={point:null,heading:state.sensor.heading,drag:false};const bar=$('corr');bar.innerHTML=`<b>Correction Mode</b><div class="metric">Tap plan location, then drag from the point toward facing direction. Confirm updates current state.</div><div class="row"><button id="corrCancel">Cancel</button><button id="corrConfirm" class="primary">Confirm</button></div>`;$('corrCancel').onclick=cancelCorrection;$('corrConfirm').onclick=confirmCorrection;bar.classList.add('show')}
function handleCorrectionDown(e){const rect=canvas.getBoundingClientRect(),w=canvasToWorld(e.clientX-rect.left,e.clientY-rect.top);const pp=state.pendingPhoto;if(pp){if(pp.step==='location'){pp.location=w;pp.step='direction';state.corr.point=w;renderLocateBar();drawTempCorrection()}else{pp.location=w;pp.heading=null;state.corr.point=w;state.corr.heading=0;drawTempCorrection()}state.corr.drag=true;return}state.corr.point=w;state.corr.drag=true}
function handleCorrectionMove(e){const cor=state.corr;if(!cor||!cor.point||!cor.drag)return;const rect=canvas.getBoundingClientRect(),w=canvasToWorld(e.clientX-rect.left,e.clientY-rect.top),p=cor.point;let angle=deg(Math.atan2(w.y-p.y,w.x-p.x))+90;const s=cur();if(s?.floorPlan)angle=(angle+s.floorPlan.northDeg+360)%360;cor.heading=angle;if(state.pendingPhoto)state.pendingPhoto.heading=angle;drawTempCorrection()}
function handleCorrectionUp(e){if(state.corr)state.corr.drag=false}
function drawTempCorrection(){draw();const p=state.corr?.point,s=cur();if(!p)return;ctx.save();ctx.translate(state.ui.transform.x,state.ui.transform.y);ctx.scale(state.ui.transform.scale,state.ui.transform.scale);drawMarker(p,(s?.floorPlan?state.corr.heading-s.floorPlan.northDeg:state.corr.heading),'?','manual');ctx.restore()}
function confirmCorrection(){const s=cur();if(!state.corr?.point||!s)return;let loc;if(s.floorPlan)loc=planToLocal(s.floorPlan,state.corr.point.x,state.corr.point.y);else loc=screenToMetric(state.corr.point.x,state.corr.point.y);state.sensor.localX=loc.x;state.sensor.localY=loc.y;state.sensor.heading=state.corr.heading;state.sensor.source='manual';s.path.push({x:loc.x,y:loc.y,t:new Date().toISOString(),manual:true});state.corr=null;$('corr').classList.remove('show');save();renderHud();draw()}
function cancelCorrection(){state.corr=null;$('corr').classList.remove('show');draw()}
function openWizard(){state.wiz={step:1,img:null,imgSrc:null,a:null,b:null,distM:null,anchor:null,northDeg:180};$('wizard').classList.add('show');renderWizard()}function renderWizard(){const w=state.wiz,body=$('wizBody');$('wizBack').disabled=w.step===1;$('wizNext').textContent=w.step===4?'Save':'Next';if(w.step===1)body.innerHTML=`<div class="notice">Import PNG/JPG. Web version intentionally uses images only; iOS version should add PDFKit rendering.</div><input type="file" id="planFile" accept="image/png,image/jpeg"><canvas id="wizCanvas" class="wizardCanvas"></canvas>`;if(w.step===2)body.innerHTML=`<div class="notice">Tap calibration Point A, then Point B. Enter real distance in metres.</div><canvas id="wizCanvas" class="wizardCanvas"></canvas><div class="field"><label>Known distance, metres</label><input id="distM" type="number" step="0.01" value="${w.distM||''}"></div>`;if(w.step===3)body.innerHTML=`<div class="notice">Tap Photo #1 location as anchor. Set northDeg: degrees clockwise from image +Y/down direction to true north. North-up plan usually = 180.</div><canvas id="wizCanvas" class="wizardCanvas"></canvas><div class="field"><label>northDeg</label><input id="northDeg" type="range" min="0" max="359" value="${w.northDeg}"><input id="northDegText" type="number" value="${w.northDeg}"></div>`;if(w.step===4){let ppm=w.a&&w.b&&w.distM?Math.hypot(w.b.x-w.a.x,w.b.y-w.a.y)/w.distM:null;body.innerHTML=`<div class="notice">Scale: ${ppm?fmt(ppm)+' px/m':'not set'}<br>Anchor: ${w.anchor?'set':'not set'}<br>northDeg: ${fmt(w.northDeg)}<br>Save will recompute all photo plan coordinates.</div>`}setTimeout(bindWizard,0)}
function bindWizard(){const c=$('wizCanvas');if($('planFile'))$('planFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{state.wiz.imgSrc=rd.result;state.wiz.img=new Image();state.wiz.img.onload=()=>drawWiz();state.wiz.img.src=rd.result};rd.readAsDataURL(f)};if(c){c.onclick=e=>{const p=wizPoint(e);const w=state.wiz;if(w.step===2){if(!w.a)w.a=p;else if(!w.b)w.b=p;else{w.a=p;w.b=null}} if(w.step===3)w.anchor=p;drawWiz()};drawWiz()}if($('distM'))$('distM').oninput=e=>state.wiz.distM=parseFloat(e.target.value);if($('northDeg')){$('northDeg').oninput=e=>{$('northDegText').value=e.target.value;state.wiz.northDeg=parseFloat(e.target.value);drawWiz()};$('northDegText').oninput=e=>{$('northDeg').value=e.target.value;state.wiz.northDeg=parseFloat(e.target.value)||0;drawWiz()}}}
function wizPoint(e){const c=$('wizCanvas'),r=c.getBoundingClientRect(),img=state.wiz.img,scale=Math.min(r.width/img.width,r.height/img.height),ox=(r.width-img.width*scale)/2,oy=(r.height-img.height*scale)/2;return{x:(e.clientX-r.left-ox)/scale,y:(e.clientY-r.top-oy)/scale}}
function drawWiz(){const c=$('wizCanvas');if(!c)return;const d=DPR(),r=c.getBoundingClientRect();c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);x.fillStyle='#111';x.fillRect(0,0,r.width,r.height);const w=state.wiz;if(!w.img){x.fillStyle=COLORS.dim;x.font='14px monospace';x.fillText('No image loaded',20,30);return}const scale=Math.min(r.width/w.img.width,r.height/w.img.height),ox=(r.width-w.img.width*scale)/2,oy=(r.height-w.img.height*scale)/2;x.drawImage(w.img,ox,oy,w.img.width*scale,w.img.height*scale);function mark(p,col,txt){if(!p)return;x.fillStyle=col;x.beginPath();x.arc(ox+p.x*scale,oy+p.y*scale,8,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.fillText(txt,ox+p.x*scale+10,oy+p.y*scale-10)}mark(w.a,COLORS.amber,'A');mark(w.b,COLORS.blue,'B');if(w.a&&w.b){x.strokeStyle=COLORS.amber;x.setLineDash([6,4]);x.beginPath();x.moveTo(ox+w.a.x*scale,oy+w.a.y*scale);x.lineTo(ox+w.b.x*scale,oy+w.b.y*scale);x.stroke();x.setLineDash([])}mark(w.anchor,COLORS.red,'ANCHOR');if(w.anchor){const a=rad(w.northDeg-90),sx=ox+w.anchor.x*scale,sy=oy+w.anchor.y*scale;x.strokeStyle=COLORS.red;x.lineWidth=3;x.beginPath();x.moveTo(sx,sy);x.lineTo(sx+Math.cos(a)*55,sy+Math.sin(a)*55);x.stroke();x.fillText('N',sx+Math.cos(a)*65,sy+Math.sin(a)*65)}}
function wizNext(){const w=state.wiz;if(w.step===1&&!w.img)return alert('Import an image first.');if(w.step===2){w.distM=parseFloat($('distM')?.value||w.distM);if(!w.a||!w.b||!w.distM)return alert('Set A, B and distance.')}if(w.step===3&&!w.anchor)return alert('Set anchor.');if(w.step<4){w.step++;renderWizard();return}saveWizard()}
function saveWizard(){const s=cur(),w=state.wiz;if(!s)return;const ppm=Math.hypot(w.b.x-w.a.x,w.b.y-w.a.y)/w.distM;const first=s.photos[0];s.floorPlan={imageData:w.imgSrc,pixelsPerMetre:ppm,calibrationDistanceM:w.distM,anchorPixelX:w.anchor.x,anchorPixelY:w.anchor.y,anchorLocalX:first?.localX||0,anchorLocalY:first?.localY||0,northDeg:w.northDeg};s.photos.forEach(p=>applyPlanToPhoto(s,p));save();$('wizard').classList.remove('show');renderAll();fitView()}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function exportJson(){const s=cur();if(s)download(`${s.name.replace(/\W+/g,'_')}.json`,JSON.stringify(s,null,2),'application/json')}function exportCsv(){const s=cur();if(!s)return;const cols=['sequenceNumber','timestamp','latitude','longitude','altitude','gpsAccuracy','localX','localY','planPixelX','planPixelY','heading','pitch','roll','positionSource'];const rows=[cols.join(',')].concat(s.photos.map(p=>cols.map(c=>JSON.stringify(p[c]??'')).join(',')));download(`${s.name.replace(/\W+/g,'_')}.csv`,rows.join('\n'),'text/csv')}
Array.from(document.querySelectorAll('.tabBtn')).forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabBody').forEach(x=>x.classList.remove('show'));$(b.dataset.tab).classList.add('show')});
$('newSession').onclick=newSession;$('startStop').onclick=toggleStart;$('deleteSession').onclick=deleteSession;$('permitBtn').onclick=enableSensors;$('cameraBtn').onclick=openCamera;$('closeCam').onclick=closeCamera;$('shutter').onclick=capture;$('resetView').onclick=fitView;$('planSetup').onclick=openWizard;$('wizClose').onclick=()=>$('wizard').classList.remove('show');$('wizBack').onclick=()=>{if(state.wiz.step>1){state.wiz.step--;renderWizard()}};$('wizNext').onclick=wizNext;$('correctBtn').onclick=startCorrection;$('downloadJson').onclick=exportJson;$('downloadCsv').onclick=exportCsv;$('menuBtn').onclick=()=>$('side').classList.toggle('open');$('vIn').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1.4)};$('vOut').onclick=()=>{const r=canvas.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,1/1.4)};$('vFit').onclick=fitView;$('vCtr').onclick=()=>{const s=cur();if(!s)return;const last=(s.photos||[]).filter(p=>p.localX!=null||p.planPixelX!=null).slice(-1)[0];if(!last){fitView();return}const r=canvas.getBoundingClientRect();let q;if(s.floorPlan)q=last.planPixelX!=null?{x:last.planPixelX,y:last.planPixelY}:localToPlan(s.floorPlan,last.localX,last.localY);else q=metricToScreen(last.localX,last.localY);const t=state.ui.transform;t.x=r.width/2-q.x*t.scale;t.y=r.height/2-q.y*t.scale;draw()};
load(); resize(); renderAll(); fitView(); setInterval(()=>{renderHud();draw()},1000);
