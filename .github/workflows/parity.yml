name: Parity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contract-test:
    name: iOS ↔ shared TS parity contract test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile=false
      - name: Run parity contract test
        run: pnpm parity
