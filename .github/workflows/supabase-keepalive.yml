name: Keepalive — ping Supabase

# Supabase pauses Free-plan projects that do not receive sufficient
# database activity over a 7-day window. A paused project can only
# be resumed from the Supabase dashboard, so the goal is to stay
# above that activity bar and never let it pause.
#
# Why this is separate from keepalive.yml: that workflow now offers
# only a manual wake of Render's web process, conserving shared Free
# instance hours. Its /healthz returns a static object and never touches
# Postgres (see server/src/routes/healthz.ts), so it does NOT count
# as Supabase activity. This workflow closes that gap with a real
# (tiny) SELECT. Two workflows, two cadences, two failure signals —
# same split-for-clarity rationale as ci.yml vs parity.yml.
#
# Cadence: Supabase pauses a Free project that does not receive
# sufficient user database activity over the past week. Their pausing
# guide says a few database requests each day is typically enough.
# Once a day is not. This job was green with HTTP 200 every day
# through 2026-10-04, and Supabase still warned on 2026-10-05 that
# project forensic (dshuodvmorxrdfahjtjn) would be paused. Four runs
# a day leaves a few requests even if GitHub skips one scheduled run.
#
# One-time setup: add two repository secrets under
# Settings → Secrets and variables → Actions → New repository secret:
#   - SUPABASE_URL         e.g. https://<project-ref>.supabase.co
#   - SUPABASE_SECRET_KEY  Supabase Dashboard → Settings → API → secret key
# These are the same two values already configured on Render (see
# render.yaml / server/.env.local.example), so you can copy them
# verbatim. Until both are set, the job logs a notice and no-ops
# (so a fork / not-yet-configured repo doesn't fail loudly).
#
# Security note: SUPABASE_SECRET_KEY is the service-role key — it
# bypasses Row Level Security. GitHub encrypts Actions secrets at
# rest and masks them in logs, and this repo is private, so the
# exposure is the same class as storing it on Render. If you prefer
# least privilege, swap in the publishable (anon) key and point the
# curl at a table that has an anon SELECT policy — but the service
# key is guaranteed to execute the query regardless of RLS, which is
# why it's the default here.
#
# If the project has ALREADY paused, this ping fails (the REST
# endpoint is unreachable while paused) and the job goes red — the
# intended signal to go resume it from the dashboard. A ping cannot
# un-pause a project.
#
# Cost: four ~5-second jobs per day ≈ 10 minutes/month of Actions
# time — negligible against the free allowance.
#
# A green run does not cancel a warning Supabase has already sent.
# After that email, open the project in the Supabase dashboard (or
# send real app traffic) before the pause. Paid plans are not
# auto-paused; this cron only covers the Free plan.

on:
  schedule:
    # Every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC.
    # GitHub cron: minute hour dom month dow. Schedules are best-effort;
    # four runs leave a few requests if one is skipped.
    - cron: "0 */6 * * *"
  # Manual trigger from the Actions tab — useful right after adding
  # the secrets, or after a pause warning, to confirm the ping works
  # without waiting for the next scheduled hour.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase to reset the inactivity timer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_SECRET_KEY secrets not set — skipping."
            echo "To enable: Settings → Secrets and variables → Actions, add both:"
            echo "  SUPABASE_URL         = https://<project-ref>.supabase.co"
            echo "  SUPABASE_SECRET_KEY  = Supabase → Settings → API → secret key"
            exit 0
          fi
          # Minimal real query: SELECT key FROM app_config LIMIT 1.
          # A 200 (even an empty []) means PostgREST executed a query
          # against Postgres. One success is a single request; the
          # six-hour schedule is what accumulates a few per day.
          # -f makes a 4xx/5xx (paused project, bad key/URL) fail the
          # job loudly; --retry rides out transient network blips.
          echo "Pinging Supabase REST API ($SUPABASE_URL) …"
          curl -fsS --max-time 30 --retry 3 --retry-delay 5 \
            -H "apikey: $SUPABASE_SECRET_KEY" \
            -H "Authorization: Bearer $SUPABASE_SECRET_KEY" \
            "$SUPABASE_URL/rest/v1/app_config?select=key&limit=1" \
            -o /dev/null -w "HTTP %{http_code}\n"
          echo "Supabase is awake."
