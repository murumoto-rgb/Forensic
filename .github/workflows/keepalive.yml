name: Wake Render server — manual only

# Let the Free API sleep when unused. Periodic wake requests consume
# the workspace's shared 750 running hours/month even without a user.
# An explicit manual wake remains available before a work session.
# Cold starts can take about one minute; a quota suspension cannot be
# cleared with a ping. Keep the Render deployment healthcheck intact.
#
# The endpoint is set via the `RENDER_HEALTHZ_URL` repository secret
# (set in Settings → Secrets and variables → Actions). Falls back
# to a no-op log line if the secret isn't set so this workflow
# doesn't fail loudly on a forked / not-yet-configured repo.

on:
  # Allow manual triggering from the Actions tab for quick wake-ups
  # before a known-imminent test session.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the server
        env:
          HEALTHZ_URL: ${{ secrets.RENDER_HEALTHZ_URL }}
        run: |
          if [ -z "$HEALTHZ_URL" ]; then
            echo "RENDER_HEALTHZ_URL secret not set — skipping ping."
            echo "To enable: Settings → Secrets and variables → Actions → New repository secret"
            echo "  Name: RENDER_HEALTHZ_URL"
            echo "  Value: https://<your-render-service>.onrender.com/healthz"
            exit 0
          fi
          echo "Pinging $HEALTHZ_URL"
          # -f: fail on HTTP errors; -s: silent (no progress);
          # -S: still show errors; --max-time 60: cap wall-clock at
          # 60 sec to cover a full cold-start without blocking GHA.
          # Retry 3 times with backoff in case the server is still
          # warming on the first attempt.
          curl -fsS --max-time 60 --retry 3 --retry-delay 5 "$HEALTHZ_URL"
          echo ""
          echo "Server is awake."
